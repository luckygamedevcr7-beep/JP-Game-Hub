async function studioScreen(el) {
  if (!isDevRole() && !isOwnerRole()) { await refreshSession(false); }
  if (!isDevRole()) { el.innerHTML = `<h1 class="page-title">Studio</h1><div class="empty"><strong>Developers only</strong>Apply to become a developer and upload your games.<div><a class="btn btn-gold" href="#/become" style="margin-top:18px">Become a developer</a></div></div>`; return; }
  el.innerHTML = `<h1 class="page-title">Studio</h1>${spinner()}`;
  const user = getUser(); const set = await loadSettings();
  let reqs, all;
  try { [reqs, all] = await withTimeout(Promise.all([myRequests(), getAllGames(true)]), 15000); }
  catch (e) { console.error(e); el.innerHTML = `<h1 class="page-title">Studio</h1>` + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  const mine = all.filter(g => g.devId === user.uid);
  const open = reqs.filter(r => r.status !== "approved" && r.type !== "developer");
  const upgPending = reqs.some(r => r.type === "upgrade" && r.status === "pending");
  const downloads = mine.reduce((s, g) => s + (g.downloads || 0), 0);

  el.innerHTML = `<h1 class="page-title">Studio ${roleBadge("developer", user.verified)}</h1>
    <div class="stats"><div><b>${mine.length}</b><span>games</span></div><div><b>${compact(downloads)}</b><span>downloads</span></div><div><b>${user.plan === "onetime" ? "One-time" : "Per game"}</b><span>plan</span></div></div>
    <a class="btn btn-gold btn-block" href="#/upload">Upload a new game${user.plan === "pergame" ? " (" + rupee(set.perGame) + ")" : ""}</a>
    ${user.plan === "pergame" && !upgPending ? `<a class="btn btn-ghost btn-block" href="#/upgrade" style="margin-top:10px">Upgrade to one-time ${rupee(set.oneTime)} (unlimited free uploads)</a>` : ""}
    ${user.plan === "pergame" && upgPending ? `<div class="notice" style="margin-top:12px"><b>Upgrade pending.</b> The owner is checking your payment.</div>` : ""}
    ${open.length ? `<h2>Submissions</h2>${open.map(r => `<div class="card">
      <div class="card-top"><b>${esc(reqTitle(r))}</b>${pill(r.status)}</div>
      <p class="hint">Sent ${fmtDate(r.createdAt)}</p>
      ${r.status === "rejected" ? `<div class="reject-box"><b>Owner's message</b><p>${esc(r.note || "Please check your details.")}</p></div><a class="btn btn-gold" href="#${fixPath(r)}">Fix and resubmit</a>` : ""}</div>`).join("")}` : ""}
    <h2>Your games</h2>
    ${mine.length ? mine.map(g => `<div class="card"><a class="g-row" style="border:0;padding:0" href="#/game/${encodeURIComponent(g.id)}"><img class="ic" src="${esc(g.iconUrl)}" alt="">
      <div class="g-info"><h3>${esc(g.title)}</h3><p class="g-by">v${esc(g.version)} - ${compact(g.downloads || 0)} downloads${g.hidden ? " - hidden" : ""}</p></div></a>
      <div class="card-btns"><a class="small-btn" href="#/update/${encodeURIComponent(g.id)}">New version</a>
      <button class="small-btn" data-edit="${esc(g.id)}">Edit text</button><button class="small-btn danger" data-del="${esc(g.id)}">Delete</button></div></div>`).join("")
      : '<div class="empty"><strong>No games yet</strong>Your approved games show up here.</div>'}
    <div class="list-head"><h2>Payments</h2><a class="link-btn" href="#/payments">History</a></div>`;

  el.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const g = mine.find(x => x.id === b.dataset.del);
    if (!await confirmSheet("Delete this game?", `"${g.title}" will be removed for everyone. This cannot be undone.`, "Delete", true)) return;
    try { await deleteGame(g); toast("Game deleted"); refresh(); } catch (e) { console.error(e); toast("Could not delete. Try again."); }
  });
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const g = mine.find(x => x.id === b.dataset.edit);
    openSheet(`<h3 class="sh-title">Edit ${esc(g.title)}</h3><div class="field"><label>Category</label><select class="select" id="e-c">${CATEGORIES.map(c => `<option ${c === g.category ? "selected" : ""}>${c}</option>`).join("")}</select></div>
      <div class="field"><label>Description</label><textarea class="textarea" id="e-d" maxlength="1500">${esc(g.description)}</textarea></div>
      <p class="hint">To change the APK link, icon or version, send a new version for approval.</p>
      <div class="sh-btns"><button class="btn btn-ghost" data-n>Cancel</button><button class="btn btn-gold" data-y>Save</button></div>`, (sh, close) => {
      sh.querySelector("[data-n]").onclick = close;
      sh.querySelector("[data-y]").onclick = async () => {
        const d = sh.querySelector("#e-d").value.trim(); if (!d) return toast("Description cannot be empty");
        try { await editGameBasics(g.id, { description: d, category: sh.querySelector("#e-c").value }); toast("Saved"); close(); refresh(); } catch (e) { console.error(e); toast("Could not save."); }
      };
    });
  });
}

async function paymentsScreen(el) {
  const back = backLink(isOwnerRole() ? "#/owner" : "#/studio", isOwnerRole() ? "Owner" : "Studio");
  el.innerHTML = back + `<h1 class="page-title">Payments</h1>${spinner()}`;
  let reqs; try { reqs = (await withTimeout(myRequests())).filter(r => r.pay); } catch (e) { console.error(e); el.innerHTML = back + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  const total = reqs.filter(r => r.status === "approved").reduce((s, r) => s + r.pay.amount, 0);

      <p class="hint">${rupee(r.pay.amount)} - ${r.pay.plan === "onetime" ? "one-time" : "per game"} - ${fmtDate(r.createdAt)}</p><p class="hint">Transaction ID: ${esc(r.pay.txn)}</p></div>`).join("")

// PART 9 - Owner panel: requests, developers, users, reports, payments, settings. Owner ko hi dikhta hai.

const OWNER_TABS = [["", "Overview"], ["requests", "Requests"], ["devs", "Developers"], ["users", "Users"], ["reports", "Reports"], ["payments", "Payments"], ["challenges", "Challenges"], ["notices", "Notices"], ["activity", "Activity"], ["settings", "Settings"]];
const otabs = active => `<div class="tabs">${OWNER_TABS.map(([k, l]) => `<a class="tab ${k === active ? "on" : ""}" href="#/owner${k ? "/" + k : ""}">${l}${k === "requests" && S.pending ? ` <i class="nb inl">${S.pending}</i>` : ""}</a>`).join("")}</div>`;

function ownerGuard(el) {
  if (isOwnerRole()) return true;
  el.innerHTML = '<div class="empty"><strong>Owner only</strong>This page is only for the owner.</div>';
  return false;
}

const ownerHome = el => ownerTab(el, { tab: "" });
async function ownerTab(el, { tab }) {
  if (!ownerGuard(el)) return;
  tab = tab || "";
  const head2 = `<h1 class="page-title">Owner</h1>${otabs(tab)}`;
  el.innerHTML = head2 + spinner();
  const body = html => { el.innerHTML = head2 + html; return el; };
  try {
    if (tab === "") await ownerOverview(el, body);
    else if (tab === "requests") await ownerRequests(el, body);
    else if (tab === "devs") await ownerPeople(el, body, true);
    else if (tab === "users") await ownerPeople(el, body, false);
    else if (tab === "reports") await ownerReports(el, body);
    else if (tab === "payments") await ownerPayments(el, body);
    else if (tab === "challenges") await ownerChallenges(el, body);
    else if (tab === "notices") await ownerNotices(el, body);
    else if (tab === "activity") await ownerActivity(el, body);
    else if (tab === "settings") await ownerSettings(el, body);
    else body('<div class="empty"><strong>Not found</strong></div>');
  } catch (e) { console.error(e); body(errorBlock("Could not load. Check your internet and Firestore rules.")); el.querySelector("#retry").onclick = () => refresh(); }
}

async function ownerOverview(el, body) {
  const s = await withTimeout(ownerStats(), 20000);
  const box = (n, l, href) => `<a class="stat-box" href="#/owner${href}"><b>${n}</b><span>${l}</span></a>`;
  body(`<div class="stat-grid">
    ${box(s.pendingReq, "pending requests", "/requests")}${box(s.openRep, "open reports", "/reports")}
    ${box(rupee(s.revenue), "revenue (approved)", "/payments")}${box(s.payments, "paid requests", "/payments")}
    ${box(s.users, "users", "/users")}${box(s.devs, "developers", "/devs")}
    ${box(s.games, "games", "")}${box(s.posts, "posts", "")}${box(s.banned, "blocked users", "/users")}</div>
    <p class="hint" style="margin-top:16px">Revenue counts payments you approved. Check each payment in your UPI app before approving.</p>`);
}

/* ---------- requests ---------- */
let reqFilter = "pending";
async function ownerRequests(el, body) {
  const list = await withTimeout(allRequests(), 20000);
  const draw = () => {
    const shown = reqFilter === "all" ? list : list.filter(r => r.status === reqFilter);
    body(`<div class="chips">${["pending", "rejected", "approved", "all"].map(f => `<button class="chip ${f === reqFilter ? "on" : ""}" data-f="${f}">${f[0].toUpperCase() + f.slice(1)}${f !== "all" ? " (" + list.filter(r => r.status === f).length + ")" : ""}</button>`).join("")}</div>
      ${shown.length ? shown.map(reqCard).join("") : `<div class="empty"><strong>Nothing here</strong>No ${reqFilter === "all" ? "" : reqFilter + " "}requests.</div>`}`);
    el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { reqFilter = b.dataset.f; draw(); });
    el.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
      const r = list.find(x => x.id === b.dataset.ok);
      if (!await confirmSheet("Approve?", r.pay ? `Have you received ${rupee(r.pay.amount)} (transaction ${r.pay.txn}) in your UPI app?` : "Approve this request?", "Approve")) return;
      b.disabled = true;
      try { await approveRequest(r); r.status = "approved"; toast("Approved"); draw(); } catch (e) { console.error(e); toast("Could not approve. Try again."); b.disabled = false; }
    });
    el.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => {
      const r = list.find(x => x.id === b.dataset.no);
      const why = await promptSheet({ title: "Reject with a reason", msg: "The developer sees this message, fixes the problem and sends it again. A paid fee is not asked twice.", label: "Reason", placeholder: "Example: Proof link does not show this game. Please add your Play Console or GitHub link.", ok: "Reject", danger: true });
      if (!why) return;
      b.disabled = true;
      try { await rejectRequest(r, why); r.status = "rejected"; r.note = why; toast("Rejected. Developer will see your message."); draw(); } catch (e) { console.error(e); toast("Could not reject. Try again."); b.disabled = false; }
    });
    el.querySelectorAll("[data-shots]").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { const sh = await requestShots(b.dataset.shots, list.find(x => x.id === b.dataset.shots)); b.parentElement.innerHTML = sh.length ? sh.map(u => `<img src="${esc(u)}" alt="Screenshot" loading="lazy">`).join("") : '<p class="hint">No screenshots.</p>'; }
      catch (e) { console.error(e); toast("Could not load screenshots."); b.disabled = false; }
    });
    el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => toast((await copyText(b.dataset.copy)) ? "Copied" : "Could not copy"));
  };
  draw();
}

function reqCard(r) {
  const f = r.form || {};
  const who = `<a href="#/u/${encodeURIComponent(r.uid)}">${esc(r.uname)}</a> <span class="p-handle">@${esc(r.uhandle)}</span>`;
  let det = "";
  if (r.type === "developer") det = `<dl class="kv"><dt>Developer name</dt><dd>${esc(f.devName)}</dd><dt>Full name</dt><dd>${esc(f.fullName)}</dd><dt>Phone</dt><dd>${esc(f.phone)}</dd><dt>About</dt><dd>${linkify(f.about || "")}</dd><dt>Links</dt><dd>${linkify(f.links || "-")}</dd><dt>Plan</dt><dd>${f.plan === "onetime" ? "One-time" : "Per game"}</dd></dl>`;
  else if (r.type === "upgrade") det = `<p class="hint">Wants to switch from per-game to the one-time plan.</p>`;
  else det = `<div class="g-row" style="border:0;padding:0"><img class="ic" src="${esc(r.iconUrl)}" alt=""><div class="g-info"><h3>${esc(f.title)}</h3><p class="g-by">${esc(f.category)} - v${esc(f.version)} - by ${esc(f.devName)}</p></div></div>
    <dl class="kv"><dt>Description</dt><dd>${linkify(f.description || "")}</dd>${f.whatsNew ? `<dt>What is new</dt><dd>${linkify(f.whatsNew)}</dd>` : ""}
    <dt>APK link</dt><dd>${linkify(f.apkLink || "")}</dd>${f.proof ? `<dt>Proof link</dt><dd>${linkify(f.proof.link || "")}</dd><dt>Developer note</dt><dd>${esc(f.proof.note || "-")}</dd>` : ""}</dl>
    ${r.shotCount ? `<div class="shots" style="margin-bottom:8px"><button class="small-btn" data-shots="${esc(r.id)}">Show ${r.shotCount} screenshot(s)</button></div>` : ""}`;
  const pay = r.pay ? `<div class="pay-info"><b>${rupee(r.pay.amount)}</b> - ${r.pay.plan === "onetime" ? "one-time plan" : "per-game fee"}
    <p>Transaction ID <code>${esc(r.pay.txn)}</code> <button class="link-btn" data-copy="${esc(r.pay.txn)}">Copy</button></p>${r.pay.payer ? `<p>Paid from: ${esc(r.pay.payer)}</p>` : ""}</div>` : (r.type === "game" ? '<p class="hint">No payment needed (one-time plan).</p>' : "");
  return `<div class="card"><div class="card-top"><b>${esc(reqTitle(r))}</b>${pill(r.status)}</div>
    <p class="hint">${who} - ${fmtDate(r.createdAt)}${r.lastReject ? " - resubmitted" : ""}</p>${det}${pay}
    ${r.status === "rejected" ? `<div class="reject-box"><b>Your reason</b><p>${esc(r.note)}</p></div>` : ""}
    ${r.status === "pending" ? `<div class="card-btns"><button class="btn btn-gold" data-ok="${esc(r.id)}">Approve</button><button class="btn btn-ghost" data-no="${esc(r.id)}">Reject</button></div>` : ""}</div>`;
}

/* ---------- developers / users ---------- */
let peopleQ = "";
async function ownerPeople(el, body, devsOnly) {
  const users = await withTimeout(allUsers(), 20000);
  const draw = () => {
    let list = users.filter(u => !devsOnly || u.role === "developer");
    const q = peopleQ.trim().toLowerCase().replace(/^@/, "");
    if (q) list = list.filter(u => `${u.name} ${u.handle} ${u.devName || ""}`.toLowerCase().includes(q));
    list.sort((a, b) => (a.role === "owner" ? -1 : 0) - (b.role === "owner" ? -1 : 0) || ms(b.createdAt) - ms(a.createdAt));
    body(`<div class="field" style="margin-top:14px"><input class="input" id="pq" type="search" placeholder="Search name or @handle" value="${esc(peopleQ)}"></div>
      <p class="hint">${list.length} ${devsOnly ? "developer" : "user"}${list.length === 1 ? "" : "s"}. Emails are never shown.</p>
      ${list.length ? list.map(u => `<div class="card"><div class="g-row" style="border:0;padding:0"><a href="#/u/${encodeURIComponent(u.id)}"><span class="avatar sm">${av(u.id, u.name)}</span></a>
        <div class="g-info"><h3>${esc(u.name)} ${roleBadge(u.role, u.verified)}${u.banned ? '<span class="badge b-ban">Blocked</span>' : ""}</h3>
        <p class="g-by">@${esc(u.handle)}${u.role === "developer" ? " - " + (u.plan === "onetime" ? "one-time" : "per game") : ""}</p></div></div>
        ${u.role === "owner" ? "" : `<div class="card-btns">
          ${u.role === "developer" ? `<button class="small-btn" data-ver="${esc(u.id)}">${u.verified ? "Remove badge" : "Verify"}</button><button class="small-btn" data-rd="${esc(u.id)}">Remove developer</button>` : ""}
          <button class="small-btn danger" data-ban="${esc(u.id)}">${u.banned ? "Unblock" : "Block"}</button></div>`}</div>`).join("") : '<div class="empty"><strong>Nobody found</strong></div>'}`);
    const pq = el.querySelector("#pq"); pq.oninput = debounce(() => { peopleQ = pq.value; const p = pq.selectionStart; draw(); const n = el.querySelector("#pq"); n.focus(); n.setSelectionRange(p, p); }, 250);
    const find = id => users.find(u => u.id === id);
    const run = async (b, fn, ok) => { b.disabled = true; try { await fn(); toast(ok); draw(); } catch (e) { console.error(e); toast("Could not update. Try again."); b.disabled = false; } };
    el.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { const u = find(b.dataset.ver); run(b, async () => { await setVerified(u.id, !u.verified); u.verified = !u.verified; }, u.verified ? "Developer verified" : "Badge removed"); });
    el.querySelectorAll("[data-rd]").forEach(b => b.onclick = async () => { const u = find(b.dataset.rd);
      if (await confirmSheet("Remove developer?", `${u.name} goes back to a normal user. Their games stay live.`, "Remove", true)) run(b, async () => { await removeDeveloper(u.id); u.role = "user"; }, "Developer removed"); });
    el.querySelectorAll("[data-ban]").forEach(b => b.onclick = async () => { const u = find(b.dataset.ban);
      if (await confirmSheet(u.banned ? "Unblock user?" : "Block user?", u.banned ? `${u.name} can use the app again and their games come back.` : `${u.name} cannot sign in or post, and their games are hidden.`, u.banned ? "Unblock" : "Block", !u.banned))
        run(b, async () => { await setBanned(u.id, !u.banned); u.banned = !u.banned; }, u.banned ? "User blocked" : "User unblocked"); });
  };
  draw();
}

/* ---------- reports ---------- */
async function ownerReports(el, body) {
  const list = await withTimeout(allReports(), 20000);
  const draw = () => {
    const open = list.filter(r => r.status === "open"), done = list.filter(r => r.status !== "open");
    const lbl = { post: "Post", game: "Game", user: "User", support: "Support", bug: "Bug" };
    const card = r => `<div class="card"><div class="card-top"><b>${lbl[r.type] || r.type}: ${esc(r.targetTitle || r.targetId)}</b><span class="pill ${r.status === "open" ? "pending" : "approved"}">${r.status}</span></div>
      <p class="hint">By ${esc(r.byName)} - ${fmtDate(r.at)}</p><p class="desc">${esc(r.reason)}</p>
      <div class="card-btns">${r.targetId ? `<a class="small-btn" href="#/${r.type === "post" ? "post" : r.type === "game" ? "game" : "u"}/${encodeURIComponent(r.targetId)}">Open</a>` : ""}${r.type === "support" || r.type === "bug" ? `<button class="small-btn" data-reply="${esc(r.id)}">Reply</button>` : ""}
      ${r.status === "open" ? `${r.type === "post" ? `<button class="small-btn danger" data-delpost="${esc(r.id)}">Delete post</button>` : ""}${r.type === "game" ? `<button class="small-btn danger" data-hide="${esc(r.id)}">Hide game</button>` : ""}${r.type === "user" ? `<button class="small-btn danger" data-banu="${esc(r.id)}">Block user</button>` : ""}
      <button class="small-btn" data-res="${esc(r.id)}">Resolve</button>` : ""}</div></div>`;
    body(`<h2>Open (${open.length})</h2>${open.map(card).join("") || '<div class="empty"><strong>No open reports</strong></div>'}${done.length ? `<h2>Resolved</h2>${done.slice(0, 20).map(card).join("")}` : ""}`);
    const find = id => list.find(r => r.id === id);
    const run = async (b, fn, ok) => { b.disabled = true; try { await fn(); toast(ok); draw(); } catch (e) { console.error(e); toast("Could not complete. Try again."); b.disabled = false; } };
    el.querySelectorAll("[data-reply]").forEach(b => b.onclick = async () => { const r = find(b.dataset.reply);
      const t = await promptSheet({ title: "Reply to " + r.byName, msg: r.reason, label: "Your reply", placeholder: "Write your reply", ok: "Send reply" }); if (!t) return;
      run(b, async () => { await notify(r.by, "info", "Reply from the owner: " + t, "/"); await resolveReport(r.id); r.status = "resolved"; }, "Reply sent"); });
    el.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { const r = find(b.dataset.res); run(b, async () => { await resolveReport(r.id); r.status = "resolved"; }, "Resolved"); });
    el.querySelectorAll("[data-delpost]").forEach(b => b.onclick = async () => { const r = find(b.dataset.delpost);
      if (await confirmSheet("Delete this post?", "It is removed for everyone.", "Delete", true)) run(b, async () => { await deleteDoc(doc(db, "posts", r.targetId)); await resolveReport(r.id); r.status = "resolved"; }, "Post deleted"); });
    el.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => { const r = find(b.dataset.hide);
      if (await confirmSheet("Hide this game?", "It disappears from the app for players. You can unhide it from the game page.", "Hide", true)) run(b, async () => { await setGameHidden(r.targetId, true); await resolveReport(r.id); r.status = "resolved"; }, "Game hidden"); });
    el.querySelectorAll("[data-banu]").forEach(b => b.onclick = async () => { const r = find(b.dataset.banu);
      if (await confirmSheet("Block this user?", "They cannot sign in or post and their games are hidden.", "Block", true)) run(b, async () => { await setBanned(r.targetId, true); await resolveReport(r.id); r.status = "resolved"; }, "User blocked"); });
  };
  draw();
}

/* ---------- payments ---------- */
async function ownerPayments(el, body) {
  const list = (await withTimeout(allRequests(), 20000)).filter(r => r.pay);
  const ok = list.filter(r => r.status === "approved");
  const total = ok.reduce((s, r) => s + r.pay.amount, 0);
  const one = ok.filter(r => r.pay.plan === "onetime").reduce((s, r) => s + r.pay.amount, 0);
  body(`<div class="stats"><div><b>${rupee(total)}</b><span>approved total</span></div><div><b>${rupee(one)}</b><span>one-time</span></div><div><b>${rupee(total - one)}</b><span>per game</span></div></div>
    ${list.length ? list.map(r => `<div class="card"><div class="card-top"><b>${rupee(r.pay.amount)} - ${esc(r.uname)}</b>${pill(r.status)}</div>
      <p class="hint">${esc(reqTitle(r))} - ${fmtDate(r.createdAt)}</p><p class="hint">Transaction ID: ${esc(r.pay.txn)}</p></div>`).join("") : '<div class="empty"><strong>No payments yet</strong></div>'}`);
}

const sstate = { q: "", mode: "games", redraw: null };   // tab badalkar wapas aao to search wahi rahe
const hq = () => document.getElementById("hq");

// Header wali search bar: tap karte hi Search page khulta hai (Play Store jaisa)
function bindHeaderSearch() {
  const input = hq();
  input.addEventListener("focus", () => { if (!location.hash.startsWith("#/search")) location.hash = "#/search"; });
  input.addEventListener("input", debounce(() => { sstate.q = input.value; if (sstate.redraw) sstate.redraw(); }, 150));
  input.addEventListener("keydown", e => { if (e.key === "Enter") { addRecent(input.value); input.blur(); } });
  onRoute(path => { if (!path.startsWith("/search")) { input.value = ""; input.blur(); sstate.redraw = null; } });
}

async function searchScreen(el) {
  const input = hq();
  input.value = sstate.q;
  el.innerHTML = `
    ${demoBanner()}
    <div class="tabs">
      <button class="tab" data-m="games">Games</button>
      <button class="tab" data-m="devs">Developers</button>
    </div>
    <div id="out">${spinner()}</div>`;

  const $ = s => el.querySelector(s);
  let all;
  try {
    all = await withTimeout(getAllGames());
  } catch (e) {
    console.error(e);
    $("#out").innerHTML = errorBlock();
    $("#retry").onclick = () => refresh();
    return;
  }

  const paintTabs = () => el.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.m === sstate.mode));
  const section = (title, body, extra = "") => `<div class="list-head"><h2>${title}</h2>${extra}</div>${body}`;

  const draw = () => {
    const out = $("#out"), q = sstate.q.trim();
    if (!q) {
      const rec = getRecents();
      let html = rec.length
        ? section("Recent", `<div class="recent">${rec.map(r => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>`, '<button class="link-btn" id="clr">Clear</button>')
        : "";
      if (sstate.mode === "games") {
        const trend = trendingGames(all, 5), top = topRated(all, 10);
        html += all.length
          ? section("Trending", trend.map(gameRow).join("")) +
            section("Top rated", top.length ? top.map((g, i) => rankRow(g, i + 1)).join("") : '<p class="hint-empty">Games show up here once players rate them.</p>')
          : '<div class="empty"><strong>Nothing here yet</strong>Games will show up once developers upload them.</div>';
      } else {
        const devs = groupDevs(all).slice(0, 10);
        html += section("Top developers", devs.length ? devs.map(devRow).join("") : '<p class="hint-empty">No developers yet.</p>');
      }
      out.innerHTML = html;
      const clr = out.querySelector("#clr");
      if (clr) clr.onclick = () => { clearRecents(); draw(); };
      out.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { sstate.q = b.dataset.r; input.value = sstate.q; draw(); });
      return;
    }
    const res = sstate.mode === "games" ? searchGames(all, q) : searchDevs(all, q);
    out.innerHTML = res.length
      ? res.map(sstate.mode === "games" ? gameRow : devRow).join("")
      : `<div class="empty"><strong>No results for "${esc(q)}"</strong>Try a different spelling, or check the other tab.</div>`;
    out.querySelectorAll(".g-row").forEach(a => a.addEventListener("click", () => addRecent(q)));
  };

  sstate.redraw = draw;
  el.querySelectorAll(".tab").forEach(t => t.onclick = () => { sstate.mode = t.dataset.m; paintTabs(); draw(); });
  paintTabs();
  draw();
  if (!sstate.q) input.focus();
}

function pollHtml(p) {
  const poll = p.poll;

    if (mine === null) return `<button class="po" data-act="vote" data-i="${i}"><span>${esc(o.t)}</span></button>`;

    return `<div class="po done ${i === mine ? "mine" : ""}"><i style="width:${pc}%"></i><span>${esc(o.t)}</span><b>${pc}%</b></div>`;
  }).join("");
  return `<div class="poll">${rows}<p class="poll-meta">${total} vote${total === 1 ? "" : "s"}</p></div>`;

const postUrl = id => location.href.split("#")[0] + "#/post/" + encodeURIComponent(id);

// Ek container par saare post actions (delegation). getPost(id) -> post object, rerender(post) -> card dobara draw.
function bindPosts(root, getPost, rerender) {
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b) {   // post ke text par tap karne se post khulta hai (links ko chhod kar)
      const tx = e.target.closest(".p-text");
      if (tx && !e.target.closest("a")) location.hash = "#/post/" + encodeURIComponent(tx.closest(".post").dataset.id);
      return;
    }
    const card = b.closest(".post");
    const p = getPost(card.dataset.id);
    if (!p) return;
    const act = b.dataset.act;

    if (act === "more") return postMenu(p, card);
    if (act === "share") {
      if (navigator.share) { try { await navigator.share({ title: "JP Game Hub", text: (p.text || "").slice(0, 100), url: postUrl(p.id) }); } catch { /* cancelled */ } return; }
      return toast((await copyText(postUrl(p.id))) ? "Link copied" : "Could not share");
    }
    if (p.sample) return toast("This is a sample post, so it can't be changed");
    if (act === "save") {
      try { const on = await toggleSavePost(p.id); rerender(p); toast(on ? "Post saved" : "Removed from saved"); } catch (err) { console.error(err); toast("Could not save. Try again."); }
      return;
    }

    if (act === "hype") {
      const was = isHyped(p.id);
      b.disabled = true;
      try {
        const r = await toggleHype(p.id, getUser().uid, p.hypes || 0, p);
        p.hypes = r.count; rerender(p);
        if (r.on !== !was) toast(r.on ? COMMUNITY.hype + " added" : COMMUNITY.hype + " removed");
      } catch (err) { console.error(err); toast("Could not update. Try again."); b.disabled = false; }
    }
    if (act === "vote") {
      try { const r = await votePoll(p.id, getUser().uid, +b.dataset.i, p.poll); p.poll = r.poll; rerender(p); }
      catch (err) { console.error(err); toast("Could not save your vote. Try again."); }
    }
  });
}

function postMenu(p, card) {
  const mine = p.authorId === getUser().uid;
  openSheet(`<h3 class="sh-title">Post options</h3>
    <button class="pick-row" data-m="link">${svg(IC.link)}<span><b>Copy link</b></span></button>

  (sh, close) => {
    sh.querySelector('[data-m="link"]').onclick = async () => { close(); toast((await copyText(postUrl(p.id))) ? "Link copied" : "Could not copy the link"); };

// Reach: post 1 second tak screen par dikhe to ek baar ginta hai
function watchReach(root, getPost) {
  if (!("IntersectionObserver" in window)) return;
  const timers = new Map();
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    const id = en.target.dataset.id;
    if (en.isIntersecting) {
      timers.set(id, setTimeout(() => {
        const p = getPost(id);
        if (p && countView(id)) { p.reach = (p.reach || 0) + 1; const n = en.target.querySelector(".static span"); if (n) n.textContent = compact(p.reach); }
      }, 1000));
    } else { clearTimeout(timers.get(id)); }
  }), { threshold: 0.6 });
  const scan = () => root.querySelectorAll(".post").forEach(el => { if (!el.dataset.w) { el.dataset.w = "1"; io.observe(el); } });
  scan();
  new MutationObserver(scan).observe(root, { childList: true, subtree: true });
}

  const KINDS = [["", "All"], ["snippet", "Snippets"], ["photo", "Photos"], ["video", "Videos"], ["poll", "Polls"], ["devlog", "Devlogs"]];
  let kindF = "";
  const filt = () => (kindF ? posts.filter(p => kindF === "snippet" ? !!p.kind : p.type === kindF && !p.kind) : posts);
  const emptyMsg = () => mode === "following"
      ? `<div class="empty"><strong>Nobody followed yet</strong>Follow players from their profile and their posts show up here.<div><a class="btn btn-ghost" href="#/community/discover" style="margin-top:18px">Find players</a></div></div>`
      : `<div class="empty"><strong>${kindF ? "Nothing here yet" : "No posts yet"}</strong>Be the first to post in the ${COMMUNITY.name}.</div>`;

  el.innerHTML = tabs + `<div class="chips sub" id="kf">${KINDS.map(([k, l]) => `<button class="chip ${k === kindF ? "on" : ""}" data-kf="${k}">${l}</button>`).join("")}</div><div id="list"></div>` + fab();
  const drawList = () => { const f = filt(); list.innerHTML = f.length ? f.map(postCard).join("") : emptyMsg(); };

  const list = el.querySelector("#list");

  bindPosts(list, id => byId.get(id), rerender);
  watchReach(list, id => byId.get(id));
}

  } catch (e) { console.error(e); el.innerHTML = tabs + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  users = users.filter(u => u.id !== me.uid && u.handle);

    const sug = users.filter(u => !following.has(u.id)).sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 8);
    const trend = trendingGames(games, 5);
    const pop = [...posts].filter(p => (p.hypes || 0) > 0).sort((a, b) => (b.hypes || 0) - (a.hypes || 0)).slice(0, 5);
    res.innerHTML = (sug.length ? `<h2>Players to follow</h2>${sug.map(userRow).join("")}` : "")

  };

    q = q.toLowerCase().replace(/^@/, "");
    const u = users.filter(x => (x.name || "").toLowerCase().includes(q) || (x.handle || "").includes(q)).slice(0, 12);
    const g = games.filter(x => (x.title || "").toLowerCase().includes(q) || (x.devName || "").toLowerCase().includes(q)).slice(0, 8);
    const p = posts.filter(x => (x.text || "").toLowerCase().includes(q) || (x.authorHandle || "").includes(q)).slice(0, 8);
    res.innerHTML = (u.length ? `<h2>Players</h2>${u.map(userRow).join("")}` : "") + (g.length ? `<h2>Games</h2>${g.map(gameRow).join("")}` : "")

      || `<div class="empty"><strong>No results</strong>Nothing matches "${esc(q)}".</div>`;
    bindPopular();
  };
  const bindPopular = () => { const pp = res.querySelector("#pp"); if (pp) { bindPosts(pp, id => byId.get(id), p => { const c = pp.querySelector(`.post[data-id="${CSS.escape(p.id)}"]`); if (c) c.outerHTML = postCard(p); }); } };

  });
  const q = el.querySelector("#dq");
  q.oninput = debounce(() => { const v = q.value.trim(); v.length >= 2 ? find(v) : home(); }, 200);

// YouTube / direct video / normal link ko pehchanta hai
function parseVideo(u) {
  u = (u || "").trim();
  if (!/^https:\/\//i.test(u)) return null;
  const yt = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if (yt) return { kind: "youtube", url: u, thumb: `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg` };
  if (/\.(mp4|webm|mov)(\?|#|$)/i.test(u)) return { kind: "file", url: u };
  return { kind: "link", url: u };
}

// PART 10 - Chats: 1-to-1 aur group. Realtime (onSnapshot). Email kahin nahi dikhta.

const chatState = { list: [], unsub: null, cbs: [] };
const dmId = (a, b) => [a, b].sort().join("_");
const seenMap = () => loadJSON("pa_chat_seen", {}, true);
const markSeen = id => { const m = seenMap(); m[id] = Date.now(); saveJSON("pa_chat_seen", m, true); };
const isUnread = c => c.lastBy && c.lastBy !== (S.fu && S.fu.uid) && ms(c.lastAt) > (seenMap()[c.id] || 0);
const chatTitle = c => c.type === "group" ? c.name : ((c.names || {})[c.members.find(m => m !== S.fu.uid)] || "Chat");

function watchChats() {
  if (chatState.unsub) chatState.unsub();
  chatState.unsub = onSnapshot(query(collection(db, "chats"), where("members", "array-contains", S.fu.uid)),
    snap => {
      chatState.list = snap.docs.map(withId).sort((a, b) => ms(b.lastAt) - ms(a.lastAt));
      chatUnread = chatState.list.filter(isUnread).length;
      navRefresh(); chatState.cbs.forEach(f => f());
    }, e => console.error(e));
}
function stopChats() { if (chatState.unsub) chatState.unsub(); chatState.unsub = null; chatState.list = []; chatUnread = 0; }

async function openDm(uid, u) {
  const me = getUser(), id = dmId(me.uid, uid), r = doc(db, "chats", id);
  const s = await getDoc(r);
  if (!s.exists()) await setDoc(r, { type: "dm", members: [me.uid, uid].sort(), names: { [me.uid]: me.name, [uid]: u.name }, createdBy: me.uid, lastText: "", lastBy: "", lastAt: serverTimestamp() });
  return id;
}
async function createGroup(name, users) {
  const me = getUser();
  const r = doc(collection(db, "chats"));
  const names = { [me.uid]: me.name }; users.forEach(u => names[u.id] = u.name);
  await setDoc(r, { type: "group", name, members: [me.uid, ...users.map(u => u.id)], names, createdBy: me.uid, lastText: "Group created", lastBy: "", lastAt: serverTimestamp() });
  return r.id;
}

async function chatsScreen(el) {
  const draw = () => {
    const list = chatState.list;
    el.innerHTML = lobbyTabs("chats") + `<div class="list-head"><h2>Messages</h2><a class="small-btn" href="#/chats/new" style="text-decoration:none">New chat</a></div>` +
      (list.length ? list.map(c => `<a class="g-row" href="#/chat/${encodeURIComponent(c.id)}"><span class="avatar sm">${c.type === "group" ? svg(IC.crowd) : (c.type === "dm" ? av((c.members.find(m => m !== S.fu.uid) || ""), chatTitle(c)) : initial(chatTitle(c)))}</span>
        <div class="g-info"><h3>${esc(chatTitle(c))}${c.type === "group" ? ' <span class="badge">Group</span>' : ""}</h3><p class="g-by">${esc(c.lastText || "Say hi")}</p></div>
        <span class="p-time">${c.lastBy ? timeAgo(c.lastAt) : ""}</span>${isUnread(c) ? '<i class="nb inl"> </i>' : ""}</a>`).join("")
        : '<div class="empty"><strong>No chats yet</strong>Open someone\'s profile and tap Message, or start a group.<div><a class="btn btn-gold" href="#/chats/new" style="margin-top:18px">Start a chat</a></div></div>');
    el.querySelectorAll(".avatar svg").forEach(s => s.classList.add("av-ic"));
  };

  chatState.cbs = [draw];
  const off = path => { if (path !== "/chats") { chatState.cbs = []; } };

// Route badalte hi ek baar chalne wala listener
const onceListeners = [];
function routeOnce(fn) { onceListeners.push(fn); }
onRoute(path => { onceListeners.splice(0).forEach(f => f(path)); });

async function newChatScreen(el) {
  const back = backLink("#/chats", "Chats");
  el.innerHTML = back + `<h1 class="page-title">New chat</h1>${spinner()}`;
  let users = [];
  try { users = (await withTimeout(listUsers(), 12000)).filter(u => u.id !== S.fu.uid && !u.banned); } catch (e) { console.error(e); el.innerHTML = back + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  let mode = "dm", q = "", extra = null; const sel = new Map();
  const draw = () => {
    const qq = q.trim().toLowerCase().replace(/^@/, "");
    let list = users.filter(u => !qq || `${u.name} ${u.handle}`.toLowerCase().includes(qq));
    if (extra && !list.some(u => u.id === extra.id)) list = [extra, ...list];
    el.innerHTML = back + `<h1 class="page-title">New chat</h1>
      <div class="tabs"><button class="tab ${mode === "dm" ? "on" : ""}" data-m="dm">One to one</button><button class="tab ${mode === "group" ? "on" : ""}" data-m="group">New group</button></div>
      ${mode === "group" ? `<div class="field" style="margin-top:14px"><input class="input" id="gn" maxlength="40" placeholder="Group name" value="${esc(el.dataset.gn || "")}"></div>` : ""}
      <div class="field" style="margin-top:14px"><input class="input" id="uq" type="search" placeholder="Search name or @handle" value="${esc(q)}" autocomplete="off" autocapitalize="off"></div>
      <div id="ul">${list.length ? list.slice(0, 40).map(u => `<button class="pick-row" data-u="${esc(u.id)}"><span class="avatar sm">${av(u.id, u.name)}</span>
        <span style="flex:1"><b>${esc(u.name)} ${roleBadge(u.role, u.verified)}</b><small>@${esc(u.handle)}</small></span>${mode === "group" ? `<span class="chk ${sel.has(u.id) ? "on" : ""}"></span>` : ""}</button>`).join("") : '<p class="hint-empty">Nobody found. Type the exact @handle to find someone.</p>'}</div>
      ${mode === "group" ? `<button class="btn btn-gold btn-block" id="mk" style="margin-top:14px">Create group (${sel.size} selected)</button>` : ""}`;
    const uq = el.querySelector("#uq");
    uq.oninput = debounce(async () => {
      q = uq.value; const p = uq.selectionStart; extra = null;
      const h = q.trim().toLowerCase().replace(/^@/, "");
      if (/^[a-z0-9_]{3,20}$/.test(h) && !users.some(u => u.handle === h)) { try { const u = await getUserByHandle(h); if (u && u.id !== S.fu.uid && !u.banned) { extra = u; users.push(u); } } catch { /* ignore */ } }
      draw(); const n = el.querySelector("#uq"); n.focus(); n.setSelectionRange(p, p);
    }, 300);
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    const gn = el.querySelector("#gn"); if (gn) gn.oninput = () => { el.dataset.gn = gn.value; };
    el.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => {
      const u = users.find(x => x.id === b.dataset.u);
      if (mode === "group") { sel.has(u.id) ? sel.delete(u.id) : sel.set(u.id, u); return draw(); }
      b.disabled = true;
      try { go("/chat/" + await openDm(u.id, u)); } catch (e) { console.error(e); toast("Could not open the chat."); b.disabled = false; }
    });
    const mk = el.querySelector("#mk");
    if (mk) mk.onclick = async () => {
      const name = (el.dataset.gn || "").trim();
      if (!name) return toast("Enter a group name");
      if (!sel.size) return toast("Pick at least one person");
      if (sel.size > 29) return toast("A group can have up to 30 people");
      mk.disabled = true;
      try { go("/chat/" + await createGroup(name, [...sel.values()])); } catch (e) { console.error(e); toast("Could not create the group."); mk.disabled = false; }
    };
  };
  draw();
}

let msgUnsub = null;
async function chatScreen(el, { id }) {
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  const back = backLink("#/chats", "Chats");
  el.innerHTML = back + spinner();
  let chat;
  try { const s = await withTimeout(getDoc(doc(db, "chats", id))); chat = s.exists() ? withId(s) : null; }
  catch (e) { console.error(e); el.innerHTML = back + '<div class="empty"><strong>Chat not available</strong>You are not part of this chat.</div>'; return; }
  if (!chat || !chat.members.includes(S.fu.uid)) { el.innerHTML = back + '<div class="empty"><strong>Chat not available</strong>You are not part of this chat.</div>'; return; }
  const me = getUser();
  const other = chat.type === "dm" ? chat.members.find(m => m !== me.uid) : null;

  el.innerHTML = `${back}<div class="chat-top"><b>${esc(chatTitle(chat))}</b>${chat.type === "group" ? '<button class="small-btn" id="ginfo">Members</button>' : `<a class="small-btn" href="#/u/${encodeURIComponent(other)}" style="text-decoration:none">Profile</a>`}</div>
    <div id="msgs" class="msgs"><div class="spinner"></div></div>
    <div class="chat-form chat-bar"><textarea class="textarea" id="mt" maxlength="1000" placeholder="Message"></textarea><button class="btn btn-gold" id="ms">Send</button></div>`;
  document.body.classList.add("in-chat");
  routeOnce(() => { document.body.classList.remove("in-chat"); if (msgUnsub) { msgUnsub(); msgUnsub = null; } });

  const box = el.querySelector("#msgs");
  msgUnsub = onSnapshot(query(collection(db, "chats", id, "msgs"), orderBy("at", "desc"), limit(120)), snap => {
    const list = snap.docs.map(withId).reverse();
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !box.dataset.init;
    box.innerHTML = list.length ? list.map(m => `<div class="msg ${m.from === me.uid ? "mine" : ""}">${chat.type === "group" && m.from !== me.uid ? `<small class="mn">${esc(m.fromName)}</small>` : ""}<div class="bub">${linkify(m.text)}</div><small class="mt">${m.at ? timeAgo(m.at) : "sending"}</small></div>`).join("")
      : '<p class="hint-empty" style="text-align:center">No messages yet. Say hi.</p>';
    box.dataset.init = "1";
    if (atBottom) window.scrollTo(0, document.body.scrollHeight);
    markSeen(id); chatUnread = chatState.list.filter(isUnread).length; navRefresh();
  }, e => { console.error(e); box.innerHTML = '<p class="hint-empty">Could not load messages.</p>'; });

  const send = async () => {
    const ta = el.querySelector("#mt"), text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    const m = doc(collection(db, "chats", id, "msgs"));
    const b = writeBatch(db);
    b.set(m, { from: me.uid, fromName: me.name, text, at: serverTimestamp() });
    b.update(doc(db, "chats", id), { lastText: (chat.type === "group" ? me.name + ": " : "") + text.slice(0, 80), lastBy: me.uid, lastAt: serverTimestamp() });
    try { await b.commit(); } catch (e) { console.error(e); ta.value = text; toast("Could not send. Try again."); }
  };
  el.querySelector("#ms").onclick = send;
  el.querySelector("#mt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); } });

  const gi = el.querySelector("#ginfo");
  if (gi) gi.onclick = () => groupInfo(chat, me);
}

function groupInfo(chat, me) {
  const mineGroup = chat.createdBy === me.uid;
  openSheet(`<h3 class="sh-title">${esc(chat.name)}</h3><p class="hint">${chat.members.length} members</p>
    <div class="sheet-list" style="max-height:38vh">${chat.members.map(m => `<div class="pick-row" style="cursor:default"><span class="avatar sm">${av(m, (chat.names || {})[m])}</span>
      <span style="flex:1"><b>${esc((chat.names || {})[m] || "Member")}${m === chat.createdBy ? ' <span class="badge">Admin</span>' : ""}</b></span>
      ${mineGroup && m !== me.uid ? `<button class="small-btn danger" data-rm="${esc(m)}">Remove</button>` : ""}</div>`).join("")}</div>
    <div class="sh-btns">${mineGroup ? '<button class="btn btn-ghost" data-add>Add people</button>' : ""}<button class="btn btn-ghost" data-leave style="color:var(--danger)">Leave group</button></div>`,
  (sh, close) => {
    sh.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      const uid = b.dataset.rm;
      try { await updateDoc(doc(db, "chats", chat.id), { members: chat.members.filter(x => x !== uid) }); chat.members = chat.members.filter(x => x !== uid); toast("Removed"); close(); } catch (e) { console.error(e); toast("Could not remove."); }
    });
    sh.querySelector("[data-leave]").onclick = async () => {
      if (!await confirmSheet("Leave this group?", "You will not get new messages.", "Leave", true)) return;
      try { await updateDoc(doc(db, "chats", chat.id), { members: chat.members.filter(x => x !== me.uid) }); close(); go("/chats"); } catch (e) { console.error(e); toast("Could not leave."); }
    };
    const add = sh.querySelector("[data-add]");
    if (add) add.onclick = async () => {
      close();
      let users = []; try { users = (await listUsers()).filter(u => !chat.members.includes(u.id) && !u.banned); } catch (e) { console.error(e); }
      const pick = new Set();
      openSheet(`<h3 class="sh-title">Add people</h3><div class="sheet-list" style="max-height:44vh">${users.length ? users.slice(0, 60).map(u => `<button class="pick-row" data-a="${esc(u.id)}"><span class="avatar sm">${av(u.id, u.name)}</span><span style="flex:1"><b>${esc(u.name)}</b><small>@${esc(u.handle)}</small></span><span class="chk"></span></button>`).join("") : '<p class="hint-empty">Everyone is already here.</p>'}</div>
        <div class="sh-btns"><button class="btn btn-gold" data-ok>Add selected</button></div>`, (s2, c2) => {
        s2.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const i = b.dataset.a; pick.has(i) ? pick.delete(i) : pick.add(i); b.querySelector(".chk").classList.toggle("on", pick.has(i)); });
        s2.querySelector("[data-ok]").onclick = async () => {
          if (!pick.size) return c2();
          if (chat.members.length + pick.size > 30) return toast("A group can have up to 30 people");
          const names = { ...(chat.names || {}) }; users.forEach(u => { if (pick.has(u.id)) names[u.id] = u.name; });
          try { await updateDoc(doc(db, "chats", chat.id), { members: [...chat.members, ...pick], names }); toast("People added"); c2(); } catch (e) { console.error(e); toast("Could not add."); }
        };
      });
    };
  });
}

let sub = "players", lbPeriod = "all";

async function topScreen(el) {
  const tabs = lobbyTabs("top");
  el.innerHTML = tabs + spinner();
  let posts, games, users, challenges;
  try { [posts, games, users, challenges] = await withTimeout(Promise.all([getPosts(200), getAllGames(), allUsers(), getChallenges().catch(() => [])]), 18000); }
  catch (e) { console.error(e); el.innerHTML = tabs + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }

  const creators = [...posts.reduce((m, p) => {
    const c = m.get(p.authorId) || { id: p.authorId, name: p.authorName, handle: p.authorHandle, hypes: 0, posts: 0 };
    c.hypes += p.hypes || 0; c.posts++; m.set(p.authorId, c); return m;
  }, new Map()).values()].sort((a, b) => b.hypes - a.hypes || b.posts - a.posts).slice(0, 10);
  const devs = groupDevs(games.filter(g => !g.sample)).slice(0, 10);
  const best = posts.filter(p => (p.hypes || 0) > 0).sort((a, b) => b.hypes - a.hypes).slice(0, 10);
  const me = getUser();
  const myPosts = posts.filter(p => p.authorId === me.uid);

  const row = (n, lead, title, sub2, right, href) => `<a class="g-row" href="${href}"><span class="rank">${n}</span>${lead}
    <div class="g-info"><h3>${title}</h3><p class="g-by">${sub2}</p></div><span class="g-get">${right}</span></a>`;
  const empty = (t, d) => `<div class="empty"><strong>${t}</strong>${d}</div>`;

  const players = () => {
    const days = lbPeriod === "week" ? 7 : lbPeriod === "month" ? 30 : 0;
    const ranked = users.filter(u => !u.banned).map(u => ({ u, score: periodScore(u, days, posts) })).filter(r => r.score > 0 || !days).sort((a, b) => b.score - a.score).slice(0, 15);
    return `<div class="chips">${[["week", "Weekly"], ["month", "Monthly"], ["all", "All-time"]].map(([k, l]) => `<button class="chip ${k === lbPeriod ? "on" : ""}" data-lb="${k}">${l}</button>`).join("")}</div>` +
      (ranked.length ? ranked.map((r, i) => row(i < 3 ? ["1st", "2nd", "3rd"][i] : i + 1, `<span class="avatar sm">${av(r.u.id, r.u.name)}</span>`,
        `${esc(r.u.name)} ${levelTag(r.u.points)}`, `@${esc(r.u.handle)} - ${r.u.streak || 0} day streak`, r.score + (days ? " activity" : " pts"), `#/u/${encodeURIComponent(r.u.id)}`)).join("")
        : empty("No players yet", "Post and open the app daily to climb the board."));
  };
  const chal = () => {
    if (!challenges.length) return empty("No challenges right now", "The owner adds new challenges here with point rewards.");
    return challenges.map(c => {
      const prog = challengeProgress(c, myPosts), pct = Math.min(100, Math.round(prog * 100 / c.goalCount)), done = prog >= c.goalCount || (S.profile.completedChallenges || []).includes(c.id);
      return `<div class="card"><div class="card-top"><b>${esc(c.title)}</b>${done ? '<span class="pill approved">Done</span>' : `<span class="pill pending">+${c.reward} pts</span>`}</div>
        <p class="hint">${esc(c.description || "")}</p>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <p class="hint">${Math.min(prog, c.goalCount)}/${c.goalCount} ${c.goalType}${c.endMs ? " - ends " + new Date(c.endMs).toLocaleDateString() : ""}</p></div>`;
    }).join("");
  };

  const draw = () => {
    const out = el.querySelector("#out");
    if (sub === "players") out.innerHTML = players();
    else if (sub === "challenges") out.innerHTML = chal();
    else if (sub === "creators") out.innerHTML = creators.length
      ? creators.map((c, i) => row(i + 1, `<span class="avatar sm">${av(c.id, c.name)}</span>`, esc(c.name), `@${esc(c.handle)}, ${c.posts} post${c.posts === 1 ? "" : "s"}`, compact(c.hypes) + " " + COMMUNITY.hype, `#/u/${encodeURIComponent(c.id)}`)).join("")
      : empty("No creators yet", "Post something and collect " + COMMUNITY.hype + " to get on the board.");
    else if (sub === "devs") out.innerHTML = devs.length
      ? devs.map((d, i) => row(i + 1, `<span class="avatar sm">${av(d.id, d.name)}</span>`, esc(d.name), `${d.games} game${d.games === 1 ? "" : "s"}`, compact(d.downloads) + " downloads", `#/u/${encodeURIComponent(d.id)}`)).join("")
      : empty("No developers yet", "Developers appear here once games are downloaded.");
    else out.innerHTML = best.length
      ? best.map((p, i) => row(i + 1, `<span class="avatar sm">${av(p.authorId, p.authorName)}</span>`, esc((p.text || "Post").slice(0, 60)), `by @${esc(p.authorHandle)}`, compact(p.hypes) + " " + COMMUNITY.hype, `#/post/${encodeURIComponent(p.id)}`)).join("")
      : empty("No top posts yet", "Posts with " + COMMUNITY.hype + " show up here.");
    el.querySelectorAll("[data-lb]").forEach(b => b.onclick = () => { lbPeriod = b.dataset.lb; draw(); });
  };

  el.innerHTML = tabs + `<div class="tabs sub">${[["players", "Players"], ["challenges", "Challenges"], ["creators", "Creators"], ["devs", "Developers"], ["posts", "Posts"]].map(([k, l]) => `<button class="tab" data-s="${k}">${l}</button>`).join("")}</div><div id="out"></div>`;
  const paint = () => el.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === sub));
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sub = b.dataset.s; paint(); draw(); });
  paint(); draw();

  // Challenge pura hua to reward milta hai
  for (const c of challenges) if (challengeProgress(c, myPosts) >= c.goalCount && !(S.profile.completedChallenges || []).includes(c.id)) {
    try { if (await awardChallenge(c)) { const t = el.querySelector("#out"); if (t && sub === "challenges") draw(); } } catch (e) { console.error(e); }
  }
}

let drawerBound = false;
let drawerGetItems = () => [];

function renderDrawer() {
  const list = document.getElementById("drawer-list");
  if (!list) return;
  const items = drawerGetItems();
  list.innerHTML = items.map(it => it.sep ? '<div class="dr-sep"></div>' : it.action
    ? `<button class="dr-item" data-action="${it.action}"><svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg>${it.label}</button>`
    : `<a class="dr-item" href="#${it.path}"><svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg>${it.label}${it.badge ? `<i class="nb inl" style="margin-left:auto">${it.badge}</i>` : ""}</a>`).join("");
}

function initDrawer(getItems) {
  drawerGetItems = getItems;
  const $ = id => document.getElementById(id);
  const btn = $("menu-btn"), list = $("drawer-list");
  renderDrawer();
  if (drawerBound) return;
  drawerBound = true;

  const isOpen = () => document.body.classList.contains("menu-open");
  const open = () => { document.body.classList.add("menu-open"); btn.setAttribute("aria-expanded", "true"); $("drawer-close").focus(); };
  const close = () => {
    if (!isOpen()) return;
    document.body.classList.remove("menu-open"); btn.setAttribute("aria-expanded", "false"); btn.focus();
  };

  btn.onclick = () => { renderDrawer(); open(); };
  $("drawer-back").onclick = close;
  $("drawer-close").onclick = close;
  $("bell-btn").onclick = () => go("/notifications");
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  window.addEventListener("hashchange", close);
  list.addEventListener("click", e => {
    const act = e.target.closest("[data-action]");
    if (act) { close(); if (act.dataset.action === "signout") doSignOut(); else if (act.dataset.action === "switch") switchAccountSheet(); else if (act.dataset.action === "support") supportSheet("support"); else if (act.dataset.action === "bug") supportSheet("bug"); return; }
    if (e.target.closest("a")) close();   // same page par tap karne par hashchange nahi aata
  });
}

function drawerItems() {
  const it = [];
  if (isOwnerRole()) it.push({ label: "Owner panel", path: "/owner", icon: I.shield, badge: S.pending || "" });
  if (isDevRole()) it.push({ label: "Studio", path: "/studio", icon: I.upload });
  else if (!isOwnerRole() && !S.devPending) it.push({ label: "Become a developer", path: "/become", icon: I.upload });
  it.push({ label: "Profile", path: "/me", icon: I.user });
  it.push({ label: "Saved games", path: "/saved", icon: I.bookmark });
  it.push({ label: "Notifications", path: "/notifications", icon: I.bell, badge: S.unread || "" });
  if (isDevRole()) it.push({ label: "Payments", path: "/payments", icon: I.games });
  it.push({ label: "Notices", path: "/notices", icon: I.info, badge: unseenNotice() ? "!" : "" });
  it.push({ label: "Help and support", action: "support", icon: I.info }, { label: "Report a bug", action: "bug", icon: I.info });
  it.push({ sep: true }, { label: "Settings", path: "/settings", icon: I.gear }, { label: "App settings", path: "/app-settings", icon: I.sliders },
    { sep: true }, { label: "About", path: "/about", icon: I.info }, { label: "Switch account", action: "switch", icon: I.out }, { label: "Sign out", action: "signout", icon: I.out });
  return it;
}

function initMenu(api) {
  api.registerRoute("/my-games", myGamesScreen);
  api.registerRoute("/account", accountScreen);
  api.registerRoute("/settings", settingsScreen);
  api.registerRoute("/app-settings", appSettingsScreen);
  api.registerRoute("/about", aboutScreen);
  api.registerRoute("/notifications", notifScreen);
  api.registerRoute("/saved", savedScreen);
  api.registerRoute("/notices", noticesScreen);
  initDrawer(drawerItems);
}

// Splash: tap karke skip, warna apne aap hat jata hai
(function splash() {
  const s = document.getElementById("splash");
  if (!s) return;
  const close = () => { s.classList.add("skip"); setTimeout(() => s.remove(), 300); };
  s.addEventListener("click", close);
  setTimeout(() => s.remove(), 4300);
})();

initGames(api);

initCommunity(api);
