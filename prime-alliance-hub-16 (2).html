function media(p) {
  let h = "";
  if (p.image) h += `<img class="p-img" src="${esc(p.image)}" alt="Post image" loading="lazy">`;
  const v = p.video;
  if (v) {
    if (v.kind === "youtube") h += `<a class="p-video" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(v.thumb)}" alt="Video thumbnail" loading="lazy"><span class="play">${svg('<path d="M8 5v14l11-7z"/>')}</span></a>`;
    else if (v.kind === "file") h += `<video class="p-img" src="${esc(v.url)}" controls preload="metadata" playsinline></video>`;
    else h += `<a class="p-linkcard" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${esc(v.url.replace(/^https?:\/\//, "").slice(0, 60))}</a>`;
  }
  return h;
}

function pollHtml(p) {
  const poll = p.poll;
  if (!poll) return "";
  const mine = myVote(p.id), total = poll.total || 0;
  const rows = poll.options.map((o, i) => {
    if (mine === null) return `<button class="po" data-act="vote" data-i="${i}"><span>${esc(o.t)}</span></button>`;
    const pc = total ? Math.round((o.v || 0) * 100 / total) : 0;
    return `<div class="po done ${i === mine ? "mine" : ""}"><i style="width:${pc}%"></i><span>${esc(o.t)}</span><b>${pc}%</b></div>`;
  }).join("");
  return `<div class="poll">${rows}<p class="poll-meta">${total} vote${total === 1 ? "" : "s"}</p></div>`;
}

function postCard(p) {
  const hyped = isHyped(p.id);
  const badge = p.game ? `<a class="p-badge" href="#/game/${encodeURIComponent(p.game.id)}">Devlog: ${esc(p.game.title)}</a>` : "";
  const tags = (p.tagGames || []).map(g => `<a class="p-tag" href="#/game/${encodeURIComponent(g.id)}">${esc(g.title)}</a>`).join("");
  return `<article class="post" data-id="${esc(p.id)}">
    <a class="p-av" href="#/u/${encodeURIComponent(p.authorId)}"><span class="avatar sm">${initial(p.authorName)}</span></a>
    <div class="p-main">
      <div class="p-head"><a class="p-name" href="#/u/${encodeURIComponent(p.authorId)}">${esc(p.authorName)}</a>
        ${roleBadge("", p.authorVerified)}<span class="p-handle">@${esc(p.authorHandle)}</span><span class="p-time">${p.sample ? "Sample" : timeAgo(p.createdAt)}</span></div>
      ${badge}
      ${p.text ? `<div class="p-text">${linkify(p.text)}</div>` : ""}
      ${media(p)}${pollHtml(p)}
      ${tags ? `<div class="p-tags">${tags}</div>` : ""}
      <div class="p-bar">
        <button class="act ${hyped ? "on" : ""}" data-act="hype" aria-pressed="${hyped}" aria-label="${COMMUNITY.hype}">${svg(IC.hype)}<span>${compact(p.hypes || 0)}</span></button>
        <a class="act" href="#/post/${encodeURIComponent(p.id)}" aria-label="${COMMUNITY.chat}">${svg(IC.chat)}<span>${compact(p.chats || 0)}</span></a>
        <span class="act static" aria-label="${COMMUNITY.reach}">${svg(IC.reach)}<span>${compact(p.reach || 0)}</span></span>
        <button class="act" data-act="share" aria-label="${COMMUNITY.share}">${svg(IC.share)}</button>
        <button class="act" data-act="more" aria-label="More">${svg(IC.more)}</button>
      </div>
    </div></article>`;
}

const postUrl = id => location.href.split("#")[0] + "#/post/" + encodeURIComponent(id);

// Ek container par saare post actions (delegation). getPost(id) -> post object, rerender(post) -> card dobara draw.
function bindPosts(root, getPost, rerender) {
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]");
    if (!b) {   // post ke text par tap karne se post khulta hai (links ko chhod kar)
      const tx = e.target.closest(".p-text");
      if (tx && !e.target.closest("a")) location.hash = "#/post/" + encodeURIComponent(tx.closest(".post").dataset.id);
      return;
    }
    const card = b.closest(".post");
    const p = getPost(card.dataset.id);
    if (!p) return;
    const act = b.dataset.act;

    if (act === "more") return postMenu(p, card);
    if (act === "share") {
      if (navigator.share) { try { await navigator.share({ title: "JP Game Hub", text: (p.text || "").slice(0, 100), url: postUrl(p.id) }); } catch { /* cancelled */ } return; }
      return toast((await copyText(postUrl(p.id))) ? "Link copied" : "Could not share");
    }
    if (p.sample) return toast("This is a sample post, so it can't be changed");

    if (act === "hype") {
      const was = isHyped(p.id);
      b.disabled = true;
      try {
        const r = await toggleHype(p.id, getUser().uid);
        p.hypes = r.count; rerender(p);
        if (r.on !== !was) toast(r.on ? COMMUNITY.hype + " added" : COMMUNITY.hype + " removed");
      } catch (err) { console.error(err); toast("Could not update. Try again."); b.disabled = false; }
    }
    if (act === "vote") {
      try { const r = await votePoll(p.id, getUser().uid, +b.dataset.i); p.poll = r.poll; rerender(p); }
      catch (err) { console.error(err); toast("Could not save your vote. Try again."); }
    }
  });
}

function postMenu(p, card) {
  const mine = p.authorId === getUser().uid;
  openSheet(`<h3 class="sh-title">Post options</h3>
    <button class="pick-row" data-m="link">${svg(IC.link)}<span><b>Copy link</b></span></button>
    ${!mine && !p.sample ? `<button class="pick-row" data-m="rep"><span><b>Report post</b><small>Tell the owner something is wrong</small></span></button>` : ""}
    ${(mine || isOwnerRole()) && !p.sample ? `<button class="pick-row danger" data-m="del"><span><b>Delete post</b></span></button>` : ""}`,
  (sh, close) => {
    sh.querySelector('[data-m="link"]').onclick = async () => { close(); toast((await copyText(postUrl(p.id))) ? "Link copied" : "Could not copy the link"); };
    const rep = sh.querySelector('[data-m="rep"]');
    if (rep) rep.onclick = async () => { close(); const why = await promptSheet({ title: "Report this post", label: "What is wrong?", placeholder: "Spam, abuse, fake, unsafe...", ok: "Send report" });
      if (!why) return; try { await sendReport("post", p.id, (p.text || "Post").slice(0, 60), why); toast("Report sent to the owner"); } catch (e) { console.error(e); toast("Could not send the report."); } };
    const del = sh.querySelector('[data-m="del"]');
    if (del) del.onclick = async () => { close(); if (!await confirmSheet("Delete this post?", "It is removed for everyone.", "Delete", true)) return;
      try { await deleteDoc(doc(db, "posts", p.id)); toast("Post deleted"); if (card.closest(".post-detail")) go("/community"); else card.remove(); } catch (e) { console.error(e); toast("Could not delete."); } };
  });
}

// Reach: post 1 second tak screen par dikhe to ek baar ginta hai
function watchReach(root, getPost) {
  if (!("IntersectionObserver" in window)) return;
  const timers = new Map();
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    const id = en.target.dataset.id;
    if (en.isIntersecting) {
      timers.set(id, setTimeout(() => {
        const p = getPost(id);
        if (p && countView(id)) { p.reach = (p.reach || 0) + 1; const n = en.target.querySelector(".static span"); if (n) n.textContent = compact(p.reach); }
      }, 1000));
    } else { clearTimeout(timers.get(id)); }
  }), { threshold: 0.6 });
  const scan = () => root.querySelectorAll(".post").forEach(el => { if (!el.dataset.w) { el.dataset.w = "1"; io.observe(el); } });
  scan();
  new MutationObserver(scan).observe(root, { childList: true, subtree: true });
}

async function openPicker({ onUser, onGame }) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="sheet-back"></div>
    <div class="sheet" role="dialog" aria-label="Tag a player or game">
      <div class="sheet-grab"></div>
      <input class="input" id="tq" type="search" placeholder="Search players or games" autocomplete="off" autocapitalize="off">
      <div class="sheet-list" id="tl"><div class="spinner"></div></div></div>`;
  document.body.appendChild(wrap);
  document.body.classList.add("menu-open");
  const close = () => { wrap.remove(); document.body.classList.remove("menu-open"); document.removeEventListener("keydown", onKey); window.removeEventListener("hashchange", close); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey); window.addEventListener("hashchange", close);
  wrap.querySelector(".sheet-back").onclick = close;

  let users = [], games = [];
  try { [users, games] = await Promise.all([listUsers(), getAllGames()]); } catch (e) { console.error(e); }
  const draw = () => {
    const q = wrap.querySelector("#tq").value.trim().toLowerCase().replace(/^@/, "");
    const u = users.filter(x => !q || (x.name + " " + x.handle).toLowerCase().includes(q)).slice(0, 8);
    const g = games.filter(x => !q || x.title.toLowerCase().includes(q)).slice(0, 8);
    wrap.querySelector("#tl").innerHTML =
      (u.length ? `<h3 class="sheet-h">Players</h3>${u.map(x => `<button class="pick-row" data-u="${esc(x.handle)}"><span class="avatar sm">${initial(x.name)}</span><span><b>${esc(x.name)}</b><small>@${esc(x.handle)}</small></span></button>`).join("")}` : "") +
      (g.length ? `<h3 class="sheet-h">Games</h3>${g.map(x => `<button class="pick-row" data-g="${esc(x.id)}"><img class="ic" src="${esc(x.iconUrl)}" alt=""><span><b>${esc(x.title)}</b><small>${esc(x.devName)}</small></span></button>`).join("")}` : "") ||
      '<p class="hint-empty">Nothing found.</p>';
    wrap.querySelectorAll("[data-u]").forEach(b => b.onclick = () => { onUser(b.dataset.u); close(); });
    wrap.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const x = games.find(y => y.id === b.dataset.g); onGame({ id: x.id, title: x.title }); close(); });
  };
  wrap.querySelector("#tq").addEventListener("input", draw);
  draw();
}

async function feed(el, mode) {
  const tabs = lobbyTabs(mode === "following" ? "following" : "feed");
  el.innerHTML = tabs + spinner();
  let posts, following = new Set();
  try {
    [posts, following] = await withTimeout(Promise.all([getFeed(), mode === "following" ? getFollowing(getUser().uid) : Promise.resolve(new Set())]), 15000);
  } catch (e) {
    console.error(e);
    el.innerHTML = tabs + errorBlock("The " + COMMUNITY.name + " could not be loaded. Check your internet and Firestore rules.");
    el.querySelector("#retry").onclick = () => refresh();
    return;
  }
  if (mode === "following") posts = posts.filter(p => following.has(p.authorId));
  const byId = new Map(posts.map(p => [p.id, p]));

  el.innerHTML = tabs + `<div id="list">${posts.length ? posts.map(postCard).join("") :
    mode === "following"
      ? `<div class="empty"><strong>Nobody followed yet</strong>Follow players from their profile and their posts show up here.<div><a class="btn btn-ghost" href="#/community/top" style="margin-top:18px">See top players</a></div></div>`
      : `<div class="empty"><strong>No posts yet</strong>Be the first to post in the ${COMMUNITY.name}.</div>`}</div>` + fab();

  const list = el.querySelector("#list");
  const rerender = p => { const c = list.querySelector(`.post[data-id="${CSS.escape(p.id)}"]`); if (c) c.outerHTML = postCard(p); };
  bindPosts(list, id => byId.get(id), rerender);
  watchReach(list, id => byId.get(id));
}

const TYPES = [["text", "Text"], ["photo", "Photo"], ["video", "Video"], ["poll", "Poll"], ["devlog", "Devlog"]];
const POST_DRAFT = "pa_post_draft";

// YouTube / direct video / normal link ko pehchanta hai
function parseVideo(u) {
  u = (u || "").trim();
  if (!/^https:\/\//i.test(u)) return null;
  const yt = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  if (yt) return { kind: "youtube", url: u, thumb: `https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg` };
  if (/\.(mp4|webm|mov)(\?|#|$)/i.test(u)) return { kind: "file", url: u };
  return { kind: "link", url: u };
}

async function composeScreen(el) {
  const user = getUser();
  if (!hasProfile(user)) { el.innerHTML = backLink("#/community", COMMUNITY.name) + `<h1 class="page-title">New post</h1>` + profileGate(); return; }

  const st = { type: "text", tagGames: [], image: "", imageName: "", video: "", poll: ["", ""], game: "", myGames: [] };
  try { st.myGames = (await withTimeout(getAllGames(), 8000)).filter(g => g.devId === user.uid); } catch { /* devlog ke bina bhi chalega */ }

  el.innerHTML = `${backLink("#/community", COMMUNITY.name)}<h1 class="page-title">New post</h1>
    <div class="tabs" id="types">${TYPES.map(([k, l]) => `<button class="tab ${k === st.type ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</div>
    <div class="field" style="margin-top:16px"><textarea class="textarea" id="tx" maxlength="${MAX_POST_CHARS}"></textarea>
      <p class="hint"><span id="cnt">0</span>/${MAX_POST_CHARS}. Type @handle to mention a player.</p></div>
    <div id="extra"></div>
    <div class="field"><button class="small-btn" id="tag" type="button">@ Tag a player or game</button><div class="p-tags" id="chips" style="margin-top:10px"></div></div>
    <button class="btn btn-gold btn-block" id="go">Post</button>`;

  const $ = s => el.querySelector(s), tx = $("#tx");
  tx.value = loadJSON(POST_DRAFT, "") || "";
  const count = () => { $("#cnt").textContent = tx.value.length; saveJSON(POST_DRAFT, tx.value); };
  tx.addEventListener("input", count); count();

  const chips = () => { $("#chips").innerHTML = st.tagGames.map((g, i) => `<button class="p-tag" data-rm="${i}" type="button">${esc(g.title)} &times;</button>`).join(""); };
  $("#chips").onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { st.tagGames.splice(+b.dataset.rm, 1); chips(); } };

  const photoField = optional => `<div class="field"><label for="im">Photo${optional ? " (optional)" : ""}</label>
    <div class="file ${st.image ? "has" : ""}"><input type="file" id="im" accept="image/*"><span class="pick">Choose</span><span class="fname">${esc(st.imageName || "Nothing selected")}</span></div>
    ${st.image ? `<img class="preview" src="${st.image}" alt="">` : ""}</div>`;

  const drawExtra = () => {
    const x = $("#extra");
    if (st.type === "photo") x.innerHTML = photoField(false);
    else if (st.type === "video") x.innerHTML = `<div class="field"><label for="vu">Video link</label>
      <input class="input" id="vu" type="url" inputmode="url" autocapitalize="off" placeholder="https://youtube.com/watch?v=..." value="${esc(st.video)}">
      <p class="hint">Paste a YouTube link or a direct .mp4 link. Video files cannot be uploaded yet.</p></div>`;
    else if (st.type === "poll") x.innerHTML = `<div class="field"><label>Options</label>${st.poll.map((o, i) =>
      `<input class="input" data-o="${i}" maxlength="60" placeholder="Option ${i + 1}" value="${esc(o)}" style="margin-bottom:8px">`).join("")}
      ${st.poll.length < 4 ? '<button class="small-btn" id="addo" type="button">Add option</button>' : ""}</div>`;
    else if (st.type === "devlog") x.innerHTML = st.myGames.length
      ? `<div class="field"><label for="gm">Game</label><select class="select" id="gm"><option value="">Choose one of your games</option>${st.myGames.map(g => `<option value="${esc(g.id)}" ${g.id === st.game ? "selected" : ""}>${esc(g.title)}</option>`).join("")}</select></div>${photoField(true)}`
      : `<div class="notice">Devlogs need a game of yours that is live on the hub. Developers can add one from the Studio tab.</div>`;
    else x.innerHTML = "";
    const im = x.querySelector("#im");
    if (im) im.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { st.image = await shrink(f, 720, 0.7); st.imageName = f.name; drawExtra(); } catch { toast("Could not read that image"); }
    };
    x.querySelectorAll("[data-o]").forEach(i => i.oninput = () => { st.poll[+i.dataset.o] = i.value; });
    const add = x.querySelector("#addo"); if (add) add.onclick = () => { st.poll.push(""); drawExtra(); };
    const vu = x.querySelector("#vu"); if (vu) vu.oninput = () => { st.video = vu.value; };
    const gm = x.querySelector("#gm"); if (gm) gm.onchange = () => { st.game = gm.value; };
  };
  drawExtra(); chips();

  $("#types").onclick = e => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    st.type = b.dataset.t;
    el.querySelectorAll("#types .tab").forEach(t => t.classList.toggle("on", t === b));
    tx.placeholder = st.type === "poll" ? "Ask a question" : st.type === "devlog" ? "What did you work on?" : "What is happening?";
    drawExtra();
  };
  tx.placeholder = "What is happening?";

  $("#tag").onclick = () => openPicker({
    onUser: h => { tx.value = (tx.value + (tx.value && !/\s$/.test(tx.value) ? " " : "") + "@" + h + " ").slice(0, MAX_POST_CHARS); count(); },
    onGame: g => { if (!st.tagGames.some(x => x.id === g.id) && st.tagGames.length < 3) { st.tagGames.push(g); chips(); } }
  });

  $("#go").onclick = async () => {
    const text = tx.value.trim(), d = { type: st.type, text, tagGames: st.tagGames, image: "" };
    if (st.type === "photo") { if (!st.image) return toast("Choose a photo"); d.image = st.image; }
    if (st.type === "video") {
      d.video = parseVideo(st.video);
      if (!d.video) return toast("Paste a video link that starts with https://");
    }
    if (st.type === "poll") {
      const opts = st.poll.map(o => o.trim()).filter(Boolean);
      if (!text) return toast("Write the poll question");
      if (opts.length < 2 || new Set(opts.map(o => o.toLowerCase())).size < opts.length) return toast("Add at least two different options");
      d.poll = { options: opts.map(t => ({ t, v: 0 })), total: 0 };
    }
    if (st.type === "devlog") {
      const g = st.myGames.find(x => x.id === st.game);
      if (!g) return toast("Choose the game this devlog is about");
      d.game = { id: g.id, title: g.title }; d.image = st.image;
    }
    if (!text && !d.image && !d.video) return toast("Write something first");
    if (d.image.length > 320000) return toast("That image is too large. Try a smaller one.");

    const btn = $("#go"); btn.disabled = true;
    try { await createPost(d, getUser()); removeKey(POST_DRAFT); toast("Posted"); go("/community"); }
    catch (e) { console.error(e); toast("Could not post. Check your connection and the Firestore rules."); btn.disabled = false; }
  };
}

    <h2>${COMMUNITY.chat}</h2><div id="chat">${chat.map(chatRow).join("") || '<p class="hint-empty" id="nochat">No messages yet.</p>'}</div>
    ${p.sample ? '<p class="hint">Chat is off for sample posts.</p>' : hasProfile(user)
      ? `<div class="chat-form"><textarea class="textarea" id="ct" maxlength="300" placeholder="Write a message"></textarea><button class="btn btn-gold" id="send">Send</button></div>`
      : `<div class="notice"><b>Set up your profile to join the chat.</b> <a href="#/account">Open profile setup</a></div>`}`;

  const pd = el.querySelector("#pd");
  bindPosts(pd, () => p, np => { pd.innerHTML = postCard(np); el.querySelector("#st").innerHTML = stats(); });
  if (!p.sample && countView(p.id)) { p.reach = (p.reach || 0) + 1; el.querySelector("#st").innerHTML = stats(); }

  const send = el.querySelector("#send");
  if (send) send.onclick = async () => {
    const t = el.querySelector("#ct").value.trim();
    if (!t) return toast("Write a message first");
    send.disabled = true;
    try {
      const c = await addChat(p.id, t, getUser());
      const nc = el.querySelector("#nochat"); if (nc) nc.remove();
      el.querySelector("#chat").insertAdjacentHTML("beforeend", chatRow(c));
      el.querySelector("#ct").value = ""; p.chats = (p.chats || 0) + 1;
      pd.innerHTML = postCard(p); el.querySelector("#st").innerHTML = stats();
    } catch (e) { console.error(e); toast("Could not send. Try again."); }
    send.disabled = false;
  };
}

async function handleRedirect(el, { handle }) {
  el.innerHTML = backLink("#/community", COMMUNITY.name) + spinner();
  let u = null;
  try { u = await withTimeout(getUserByHandle(handle), 10000); } catch (e) { console.error(e); }
  if (u) location.replace("#/u/" + encodeURIComponent(u.id));
  else el.innerHTML = backLink("#/community", COMMUNITY.name) + `<div class="empty"><strong>No player @${esc(handle)}</strong>That handle has not been claimed.</div>`;
}

const userProfile = (el, { id }) => profile(el, id, id === getUser().uid);
const myProfile = el => profile(el, getUser().uid, true);

async function profile(el, id, isMe) {
  const top = isMe ? lobbyTabs("me") : backLink("#/community", COMMUNITY.name);
  const me = getUser();
  el.innerHTML = top + spinner();

  let u, posts, counts, games, following, savedIds = new Set();
  try {
    [u, posts, counts, games, following, savedIds] = await withTimeout(Promise.all([
      getUserById(id), postsByAuthor(id), followCounts(id), getAllGames(), isMe ? Promise.resolve(new Set()) : getFollowing(me.uid),
      isMe ? getSavedIds() : Promise.resolve(new Set())
    ]), 15000);
  } catch (e) { console.error(e); el.innerHTML = top + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }

  if (!u && isMe) u = { name: me.name, handle: me.handle, bio: me.bio, role: me.role, verified: me.verified };
  if (!u) { el.innerHTML = top + '<div class="empty"><strong>Player not found</strong>This profile does not exist.</div>'; return; }

  const mine = games.filter(g => g.devId === id);
  const saved = games.filter(g => savedIds.has(g.id));
  const polls = posts.filter(p => p.poll);
  const hypes = posts.reduce((s, p) => s + (p.hypes || 0), 0);
  let isFollowing = following.has(id), tab = "posts";
  const sample = String(id).startsWith("sample");
  const role = isMe ? me.role : (u.role || "user");

  const actionBtn = () => isMe ? '<a class="btn btn-ghost" href="#/account">Edit profile</a>'
    : sample ? "" : `<button class="btn ${isFollowing ? "btn-ghost" : "btn-gold"}" id="fol">${isFollowing ? "Following" : "Follow"}</button><button class="btn btn-ghost" id="msg" style="margin-left:8px">Message</button>`;

  const byId = new Map(posts.map(p => [p.id, p]));
  const tabs = [["posts", `Posts (${posts.length})`], ["polls", `Polls (${polls.length})`], ["games", `Games (${mine.length})`]];
  if (isMe) tabs.push(["saved", `Saved (${saved.length})`]);
  el.innerHTML = `${top}
    <div class="prof-head"><span class="avatar big">${initial(u.name)}</span>
      <div class="prof-act">${actionBtn()}</div></div>
    <h1 class="prof-name">${esc(u.name)} ${roleBadge(role, u.verified)}</h1><p class="p-handle">@${esc(u.handle)}${role === "developer" && u.plan ? "" : ""}</p>
    ${u.bio ? `<p class="prof-bio">${esc(u.bio)}</p>` : ""}
    <div class="stats"><div><b>${compact(posts.length)}</b><span>posts</span></div><div><b id="fc">${compact(counts.followers)}</b><span>followers</span></div>
      <div><b>${compact(counts.following)}</b><span>following</span></div><div><b>${compact(hypes)}</b><span>${COMMUNITY.hype}</span></div></div>
    ${isMe && role === "user" ? `<a class="btn btn-ghost btn-block" href="#/become" style="margin-bottom:12px">Become a developer</a>` : ""}
    ${isMe && role === "developer" ? `<a class="btn btn-ghost btn-block" href="#/studio" style="margin-bottom:12px">Open Studio</a>` : ""}
    ${!isMe && !sample ? `<div class="card-btns" style="margin:0 0 6px"><button class="link-btn" id="rep">Report this user</button>${isOwnerRole() ? '<button class="link-btn" id="blk" style="color:var(--danger)">Block user</button>' : ""}</div>` : ""}
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" data-p="${k}">${l}</button>`).join("")}</div>
    <div id="pl"></div>${isMe ? fab() : ""}`;

  const pl = el.querySelector("#pl");
  const none = (t, d) => `<div class="empty"><strong>${t}</strong>${d}</div>`;
  const draw = () => {
    pl.innerHTML = tab === "posts" ? (posts.length ? posts.map(postCard).join("") : none("No posts yet", isMe ? "Your posts show up here." : "Nothing posted yet."))
      : tab === "polls" ? (polls.length ? polls.map(postCard).join("") : none("No polls yet", isMe ? "Create a poll from the + button." : "No polls yet."))
      : tab === "games" ? (mine.length ? mine.map(gameRow).join("") : none("No games yet", "Uploaded games show up here."))
      : (saved.length ? saved.map(gameRow).join("") : none("Nothing saved", "Tap Save game on any game page."));
  };
  draw();
  el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { tab = b.dataset.p; el.querySelectorAll("[data-p]").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  bindPosts(pl, pid => byId.get(pid), p => { const c = pl.querySelector(`.post[data-id="${CSS.escape(p.id)}"]`); if (c) c.outerHTML = postCard(p); });
  watchReach(pl, pid => byId.get(pid));

  const bindFollow = () => {
    const fol = el.querySelector("#fol");
    if (fol) fol.onclick = async () => {
      fol.disabled = true;
      try {
        isFollowing = await toggleFollow(me.uid, id);
        counts.followers += isFollowing ? 1 : -1;
        el.querySelector("#fc").textContent = compact(counts.followers);
        fol.textContent = isFollowing ? "Following" : "Follow"; fol.className = "btn " + (isFollowing ? "btn-ghost" : "btn-gold");
      } catch (e) { console.error(e); toast("Could not update. Try again."); }
      fol.disabled = false;
    };
    const msg = el.querySelector("#msg");
    if (msg) msg.onclick = async () => { msg.disabled = true; try { go("/chat/" + await openDm(id, u)); } catch (e) { console.error(e); toast("Could not open the chat."); msg.disabled = false; } };
  };
  bindFollow();
  const rep = el.querySelector("#rep");
  if (rep) rep.onclick = async () => {
    const why = await promptSheet({ title: "Report this user", label: "What is wrong?", placeholder: "Abuse, spam, fake developer...", ok: "Send report" });
    if (!why) return;
    try { await sendReport("user", id, u.name + " (@" + u.handle + ")", why); toast("Report sent to the owner"); } catch (e) { console.error(e); toast("Could not send the report."); }
  };
  const blk = el.querySelector("#blk");
  if (blk) blk.onclick = async () => { if (!await confirmSheet("Block this user?", "They cannot sign in or post and their games are hidden.", "Block", true)) return;
    try { await setBanned(id, true); toast("User blocked"); } catch (e) { console.error(e); toast("Could not block."); } };
}

// PART 10 - Chats: 1-to-1 aur group. Realtime (onSnapshot). Email kahin nahi dikhta.

const chatState = { list: [], unsub: null, cbs: [] };
const dmId = (a, b) => [a, b].sort().join("_");
const seenMap = () => loadJSON("pa_chat_seen", {}, true);
const markSeen = id => { const m = seenMap(); m[id] = Date.now(); saveJSON("pa_chat_seen", m, true); };
const isUnread = c => c.lastBy && c.lastBy !== (S.fu && S.fu.uid) && ms(c.lastAt) > (seenMap()[c.id] || 0);
const chatTitle = c => c.type === "group" ? c.name : ((c.names || {})[c.members.find(m => m !== S.fu.uid)] || "Chat");

function watchChats() {
  if (chatState.unsub) chatState.unsub();
  chatState.unsub = onSnapshot(query(collection(db, "chats"), where("members", "array-contains", S.fu.uid)),
    snap => {
      chatState.list = snap.docs.map(withId).sort((a, b) => ms(b.lastAt) - ms(a.lastAt));
      chatUnread = chatState.list.filter(isUnread).length;
      navRefresh(); chatState.cbs.forEach(f => f());
    }, e => console.error(e));
}
function stopChats() { if (chatState.unsub) chatState.unsub(); chatState.unsub = null; chatState.list = []; chatUnread = 0; }

async function openDm(uid, u) {
  const me = getUser(), id = dmId(me.uid, uid), r = doc(db, "chats", id);
  const s = await getDoc(r);
  if (!s.exists()) await setDoc(r, { type: "dm", members: [me.uid, uid].sort(), names: { [me.uid]: me.name, [uid]: u.name }, createdBy: me.uid, lastText: "", lastBy: "", lastAt: serverTimestamp() });
  return id;
}
async function createGroup(name, users) {
  const me = getUser();
  const r = doc(collection(db, "chats"));
  const names = { [me.uid]: me.name }; users.forEach(u => names[u.id] = u.name);
  await setDoc(r, { type: "group", name, members: [me.uid, ...users.map(u => u.id)], names, createdBy: me.uid, lastText: "Group created", lastBy: "", lastAt: serverTimestamp() });
  return r.id;
}

async function chatsScreen(el) {
  const draw = () => {
    const list = chatState.list;
    el.innerHTML = lobbyTabs("chats") + `<div class="list-head"><h2>Messages</h2><a class="small-btn" href="#/chats/new" style="text-decoration:none">New chat</a></div>` +
      (list.length ? list.map(c => `<a class="g-row" href="#/chat/${encodeURIComponent(c.id)}"><span class="avatar sm">${c.type === "group" ? svg(IC.crowd) : initial(chatTitle(c))}</span>
        <div class="g-info"><h3>${esc(chatTitle(c))}${c.type === "group" ? ' <span class="badge">Group</span>' : ""}</h3><p class="g-by">${esc(c.lastText || "Say hi")}</p></div>
        <span class="p-time">${c.lastBy ? timeAgo(c.lastAt) : ""}</span>${isUnread(c) ? '<i class="nb inl"> </i>' : ""}</a>`).join("")
        : '<div class="empty"><strong>No chats yet</strong>Open someone\'s profile and tap Message, or start a group.<div><a class="btn btn-gold" href="#/chats/new" style="margin-top:18px">Start a chat</a></div></div>');
    el.querySelectorAll(".avatar svg").forEach(s => s.classList.add("av-ic"));
  };
  draw();
  chatState.cbs = [draw];
  const off = path => { if (path !== "/chats") { chatState.cbs = []; } };
  routeOnce(off);
}

// Route badalte hi ek baar chalne wala listener
const onceListeners = [];
function routeOnce(fn) { onceListeners.push(fn); }
onRoute(path => { onceListeners.splice(0).forEach(f => f(path)); });

async function newChatScreen(el) {
  const back = backLink("#/chats", "Chats");
  el.innerHTML = back + `<h1 class="page-title">New chat</h1>${spinner()}`;
  let users = [];
  try { users = (await withTimeout(listUsers(), 12000)).filter(u => u.id !== S.fu.uid && !u.banned); } catch (e) { console.error(e); el.innerHTML = back + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  let mode = "dm", q = "", extra = null; const sel = new Map();
  const draw = () => {
    const qq = q.trim().toLowerCase().replace(/^@/, "");
    let list = users.filter(u => !qq || `${u.name} ${u.handle}`.toLowerCase().includes(qq));
    if (extra && !list.some(u => u.id === extra.id)) list = [extra, ...list];
    el.innerHTML = back + `<h1 class="page-title">New chat</h1>
      <div class="tabs"><button class="tab ${mode === "dm" ? "on" : ""}" data-m="dm">One to one</button><button class="tab ${mode === "group" ? "on" : ""}" data-m="group">New group</button></div>
      ${mode === "group" ? `<div class="field" style="margin-top:14px"><input class="input" id="gn" maxlength="40" placeholder="Group name" value="${esc(el.dataset.gn || "")}"></div>` : ""}
      <div class="field" style="margin-top:14px"><input class="input" id="uq" type="search" placeholder="Search name or @handle" value="${esc(q)}" autocomplete="off" autocapitalize="off"></div>
      <div id="ul">${list.length ? list.slice(0, 40).map(u => `<button class="pick-row" data-u="${esc(u.id)}"><span class="avatar sm">${initial(u.name)}</span>
        <span style="flex:1"><b>${esc(u.name)} ${roleBadge(u.role, u.verified)}</b><small>@${esc(u.handle)}</small></span>${mode === "group" ? `<span class="chk ${sel.has(u.id) ? "on" : ""}"></span>` : ""}</button>`).join("") : '<p class="hint-empty">Nobody found. Type the exact @handle to find someone.</p>'}</div>
      ${mode === "group" ? `<button class="btn btn-gold btn-block" id="mk" style="margin-top:14px">Create group (${sel.size} selected)</button>` : ""}`;
    const uq = el.querySelector("#uq");
    uq.oninput = debounce(async () => {
      q = uq.value; const p = uq.selectionStart; extra = null;
      const h = q.trim().toLowerCase().replace(/^@/, "");
      if (/^[a-z0-9_]{3,20}$/.test(h) && !users.some(u => u.handle === h)) { try { const u = await getUserByHandle(h); if (u && u.id !== S.fu.uid && !u.banned) { extra = u; users.push(u); } } catch { /* ignore */ } }
      draw(); const n = el.querySelector("#uq"); n.focus(); n.setSelectionRange(p, p);
    }, 300);
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    const gn = el.querySelector("#gn"); if (gn) gn.oninput = () => { el.dataset.gn = gn.value; };
    el.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => {
      const u = users.find(x => x.id === b.dataset.u);
      if (mode === "group") { sel.has(u.id) ? sel.delete(u.id) : sel.set(u.id, u); return draw(); }
      b.disabled = true;
      try { go("/chat/" + await openDm(u.id, u)); } catch (e) { console.error(e); toast("Could not open the chat."); b.disabled = false; }
    });
    const mk = el.querySelector("#mk");
    if (mk) mk.onclick = async () => {
      const name = (el.dataset.gn || "").trim();
      if (!name) return toast("Enter a group name");
      if (!sel.size) return toast("Pick at least one person");
      if (sel.size > 29) return toast("A group can have up to 30 people");
      mk.disabled = true;
      try { go("/chat/" + await createGroup(name, [...sel.values()])); } catch (e) { console.error(e); toast("Could not create the group."); mk.disabled = false; }
    };
  };
  draw();
}

let msgUnsub = null;
async function chatScreen(el, { id }) {
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  const back = backLink("#/chats", "Chats");
  el.innerHTML = back + spinner();
  let chat;
  try { const s = await withTimeout(getDoc(doc(db, "chats", id))); chat = s.exists() ? withId(s) : null; }
  catch (e) { console.error(e); el.innerHTML = back + '<div class="empty"><strong>Chat not available</strong>You are not part of this chat.</div>'; return; }
  if (!chat || !chat.members.includes(S.fu.uid)) { el.innerHTML = back + '<div class="empty"><strong>Chat not available</strong>You are not part of this chat.</div>'; return; }
  const me = getUser();
  const other = chat.type === "dm" ? chat.members.find(m => m !== me.uid) : null;

  el.innerHTML = `${back}<div class="chat-top"><b>${esc(chatTitle(chat))}</b>${chat.type === "group" ? '<button class="small-btn" id="ginfo">Members</button>' : `<a class="small-btn" href="#/u/${encodeURIComponent(other)}" style="text-decoration:none">Profile</a>`}</div>
    <div id="msgs" class="msgs"><div class="spinner"></div></div>
    <div class="chat-form chat-bar"><textarea class="textarea" id="mt" maxlength="1000" placeholder="Message"></textarea><button class="btn btn-gold" id="ms">Send</button></div>`;
  document.body.classList.add("in-chat");
  routeOnce(() => { document.body.classList.remove("in-chat"); if (msgUnsub) { msgUnsub(); msgUnsub = null; } });

  const box = el.querySelector("#msgs");
  msgUnsub = onSnapshot(query(collection(db, "chats", id, "msgs"), orderBy("at", "desc"), limit(120)), snap => {
    const list = snap.docs.map(withId).reverse();
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !box.dataset.init;
    box.innerHTML = list.length ? list.map(m => `<div class="msg ${m.from === me.uid ? "mine" : ""}">${chat.type === "group" && m.from !== me.uid ? `<small class="mn">${esc(m.fromName)}</small>` : ""}<div class="bub">${linkify(m.text)}</div><small class="mt">${m.at ? timeAgo(m.at) : "sending"}</small></div>`).join("")
      : '<p class="hint-empty" style="text-align:center">No messages yet. Say hi.</p>';
    box.dataset.init = "1";
    if (atBottom) window.scrollTo(0, document.body.scrollHeight);
    markSeen(id); chatUnread = chatState.list.filter(isUnread).length; navRefresh();
  }, e => { console.error(e); box.innerHTML = '<p class="hint-empty">Could not load messages.</p>'; });

  const send = async () => {
    const ta = el.querySelector("#mt"), text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    const m = doc(collection(db, "chats", id, "msgs"));
    const b = writeBatch(db);
    b.set(m, { from: me.uid, fromName: me.name, text, at: serverTimestamp() });
    b.update(doc(db, "chats", id), { lastText: (chat.type === "group" ? me.name + ": " : "") + text.slice(0, 80), lastBy: me.uid, lastAt: serverTimestamp() });
    try { await b.commit(); } catch (e) { console.error(e); ta.value = text; toast("Could not send. Try again."); }
  };
  el.querySelector("#ms").onclick = send;
  el.querySelector("#mt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); } });

  const gi = el.querySelector("#ginfo");
  if (gi) gi.onclick = () => groupInfo(chat, me);
}

function groupInfo(chat, me) {
  const mineGroup = chat.createdBy === me.uid;
  openSheet(`<h3 class="sh-title">${esc(chat.name)}</h3><p class="hint">${chat.members.length} members</p>
    <div class="sheet-list" style="max-height:38vh">${chat.members.map(m => `<div class="pick-row" style="cursor:default"><span class="avatar sm">${initial((chat.names || {})[m])}</span>
      <span style="flex:1"><b>${esc((chat.names || {})[m] || "Member")}${m === chat.createdBy ? ' <span class="badge">Admin</span>' : ""}</b></span>
      ${mineGroup && m !== me.uid ? `<button class="small-btn danger" data-rm="${esc(m)}">Remove</button>` : ""}</div>`).join("")}</div>
    <div class="sh-btns">${mineGroup ? '<button class="btn btn-ghost" data-add>Add people</button>' : ""}<button class="btn btn-ghost" data-leave style="color:var(--danger)">Leave group</button></div>`,
  (sh, close) => {
    sh.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
      const uid = b.dataset.rm;
      try { await updateDoc(doc(db, "chats", chat.id), { members: chat.members.filter(x => x !== uid) }); chat.members = chat.members.filter(x => x !== uid); toast("Removed"); close(); } catch (e) { console.error(e); toast("Could not remove."); }
    });
    sh.querySelector("[data-leave]").onclick = async () => {
      if (!await confirmSheet("Leave this group?", "You will not get new messages.", "Leave", true)) return;
      try { await updateDoc(doc(db, "chats", chat.id), { members: chat.members.filter(x => x !== me.uid) }); close(); go("/chats"); } catch (e) { console.error(e); toast("Could not leave."); }
    };
    const add = sh.querySelector("[data-add]");
    if (add) add.onclick = async () => {
      close();
      let users = []; try { users = (await listUsers()).filter(u => !chat.members.includes(u.id) && !u.banned); } catch (e) { console.error(e); }
      const pick = new Set();
      openSheet(`<h3 class="sh-title">Add people</h3><div class="sheet-list" style="max-height:44vh">${users.length ? users.slice(0, 60).map(u => `<button class="pick-row" data-a="${esc(u.id)}"><span class="avatar sm">${initial(u.name)}</span><span style="flex:1"><b>${esc(u.name)}</b><small>@${esc(u.handle)}</small></span><span class="chk"></span></button>`).join("") : '<p class="hint-empty">Everyone is already here.</p>'}</div>
        <div class="sh-btns"><button class="btn btn-gold" data-ok>Add selected</button></div>`, (s2, c2) => {
        s2.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const i = b.dataset.a; pick.has(i) ? pick.delete(i) : pick.add(i); b.querySelector(".chk").classList.toggle("on", pick.has(i)); });
        s2.querySelector("[data-ok]").onclick = async () => {
          if (!pick.size) return c2();
          if (chat.members.length + pick.size > 30) return toast("A group can have up to 30 people");
          const names = { ...(chat.names || {}) }; users.forEach(u => { if (pick.has(u.id)) names[u.id] = u.name; });
          try { await updateDoc(doc(db, "chats", chat.id), { members: [...chat.members, ...pick], names }); toast("People added"); c2(); } catch (e) { console.error(e); toast("Could not add."); }
        };
      });
    };
  });
}

  try { list = await withTimeout(getNotifs()); } catch (e) { console.error(e); el.innerHTML = h + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }
  el.innerHTML = h + (list.length ? list.map(n => `<a class="notif ${n.read ? "" : "new"}" href="#${esc(n.link || "/")}"><span class="n-ic ${n.kind}">${svg(NOTIF_ICON[n.kind] || IC.chat)}</span>
    <div><p>${esc(n.text)}</p><small>${timeAgo(n.at)}</small></div></a>`).join("") : '<div class="empty"><strong>Nothing yet</strong>Approvals, comments and followers show up here.</div>');
  markNotifsRead(list).catch(console.error);
}

// ===== 25_js__parts__community__topScreen.js =====
let sub = "creators";

async function topScreen(el) {
  const tabs = lobbyTabs("top");
  el.innerHTML = tabs + spinner();
  let posts, games;
  try { [posts, games] = await withTimeout(Promise.all([getPosts(200), getAllGames()]), 15000); }
  catch (e) { console.error(e); el.innerHTML = tabs + errorBlock(); el.querySelector("#retry").onclick = () => refresh(); return; }

  const creators = [...posts.reduce((m, p) => {
    const c = m.get(p.authorId) || { id: p.authorId, name: p.authorName, handle: p.authorHandle, hypes: 0, posts: 0 };
    c.hypes += p.hypes || 0; c.posts++; m.set(p.authorId, c); return m;
  }, new Map()).values()].sort((a, b) => b.hypes - a.hypes || b.posts - a.posts).slice(0, 10);
  const devs = groupDevs(games.filter(g => !g.sample)).slice(0, 10);
  const best = posts.filter(p => (p.hypes || 0) > 0).sort((a, b) => b.hypes - a.hypes).slice(0, 10);

  const row = (n, lead, title, sub2, right, href) => `<a class="g-row" href="${href}"><span class="rank">${n}</span>${lead}
    <div class="g-info"><h3>${esc(title)}</h3><p class="g-by">${sub2}</p></div><span class="g-get">${right}</span></a>`;
  const empty = (t, d) => `<div class="empty"><strong>${t}</strong>${d}</div>`;

  const draw = () => {
    const out = el.querySelector("#out");
    if (sub === "creators") out.innerHTML = creators.length
      ? creators.map((c, i) => row(i + 1, `<span class="avatar sm">${initial(c.name)}</span>`, c.name, `@${esc(c.handle)}, ${c.posts} post${c.posts === 1 ? "" : "s"}`, compact(c.hypes) + " " + COMMUNITY.hype, `#/u/${encodeURIComponent(c.id)}`)).join("")
      : empty("No creators yet", "Post something and collect " + COMMUNITY.hype + " to get on the board.");
    else if (sub === "devs") out.innerHTML = devs.length
      ? devs.map((d, i) => row(i + 1, `<span class="avatar sm">${initial(d.name)}</span>`, d.name, `${d.games} game${d.games === 1 ? "" : "s"}`, compact(d.downloads) + " downloads", `#/u/${encodeURIComponent(d.id)}`)).join("")
      : empty("No developers yet", "Developers appear here once games are downloaded.");
    else out.innerHTML = best.length
      ? best.map((p, i) => row(i + 1, `<span class="avatar sm">${initial(p.authorName)}</span>`, (p.text || "Post").slice(0, 60), `by @${esc(p.authorHandle)}`, compact(p.hypes) + " " + COMMUNITY.hype, `#/post/${encodeURIComponent(p.id)}`)).join("")
      : empty("No top posts yet", "Posts with " + COMMUNITY.hype + " show up here.");
  };

  el.innerHTML = tabs + `<div class="tabs sub"><button class="tab" data-s="creators">Creators</button><button class="tab" data-s="devs">Developers</button><button class="tab" data-s="posts">Posts</button></div><div id="out"></div>`;
  const paint = () => el.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === sub));
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sub = b.dataset.s; paint(); draw(); });
  paint(); draw();
}

const head = title => backLink("#/", "Games") + `<h1 class="page-title">${title}</h1>`;

async function accountScreen(el) {
  const user = getUser();
  const locked = !!user.handle;   // handle ek baar claim hone ke baad badalta nahi
  el.innerHTML = head("Profile") + `
    <div class="acc-head">
      <span class="avatar" id="av">${initial(user.name || "?")}</span>
      <div><b id="nm">${esc(user.name || "No name yet")}</b><p id="st">Loading stats</p></div>
    </div>
    <div class="field"><label for="dn">Name</label>
      <input class="input" id="dn" maxlength="40" value="${esc(user.name)}" placeholder="Shown on your games and posts" autocomplete="off"></div>
    <div class="field"><label for="hd">Handle</label>
      <input class="input" id="hd" maxlength="20" value="${esc(user.handle)}" placeholder="yourname" autocomplete="off" autocapitalize="off" ${locked ? "disabled" : ""}>
      <p class="hint">${locked ? "Your handle is locked." : "3 to 20 letters, numbers or underscores. People tag you with @handle. You cannot change it later."}</p></div>
    <div class="field"><label for="bo">Bio</label>
      <textarea class="textarea" id="bo" maxlength="160" style="min-height:80px" placeholder="A line about you">${esc(user.bio)}</textarea></div>
    <button class="btn btn-gold btn-block" id="save">Save profile</button>
    <div class="set-row" style="margin-top:18px"><div><b>Account type</b><small>${user.role === "owner" ? "Owner" : user.role === "developer" ? "Developer" : "User"}</small></div>${user.role === "user" ? '<a class="small-btn" href="#/become" style="text-decoration:none">Become a developer</a>' : ""}</div>
    <button class="btn btn-ghost btn-block" id="out" style="margin-top:18px">Sign out</button>
    <p class="hint" style="margin-top:14px">Your email address is private. It is never shown to other people.</p>`;
  el.querySelector("#out").onclick = doSignOut;

  el.querySelector("#save").onclick = async () => {
    const name = el.querySelector("#dn").value.trim(), bio = el.querySelector("#bo").value.trim();
    const handle = el.querySelector("#hd").value.trim().toLowerCase().replace(/^@/, "");
    if (!name) return toast("Enter your name");
    if (!locked && !/^[a-z0-9_]{3,20}$/.test(handle)) return toast("Handle needs 3 to 20 letters, numbers or underscores");
    const btn = el.querySelector("#save"); btn.disabled = true;
    try {
      const h = await saveProfile(user, { name, handle, bio });
      el.querySelector("#nm").textContent = name; el.querySelector("#av").innerHTML = initial(name);
      if (!locked) { el.querySelector("#hd").disabled = true; }
      toast("Profile saved as @" + h);
    } catch (e) {
      console.error(e);
      toast(e.message === "taken" ? "That handle is already taken" : e.message === "bad-handle" ? "That handle is not valid" : "Could not save. Check your connection and Firestore rules.");
    }
    btn.disabled = false;
  };

  try {
    const all = await withTimeout(getAllGames(), 8000);
    const mine = all.filter(g => g.devId === user.uid);
    el.querySelector("#st").textContent = `${mine.length} game${mine.length === 1 ? "" : "s"}, ${compact(mine.reduce((s, g) => s + (g.downloads || 0), 0))} downloads`;
  } catch { el.querySelector("#st").textContent = "Stats unavailable right now"; }
}

// ===== 28_js__parts__menu__drawer.js =====
let drawerBound = false;
let drawerGetItems = () => [];

function renderDrawer() {
  const list = document.getElementById("drawer-list");
  if (!list) return;
  const items = drawerGetItems();
  list.innerHTML = items.map(it => it.sep ? '<div class="dr-sep"></div>' : it.action
    ? `<button class="dr-item" data-action="${it.action}"><svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg>${it.label}</button>`
    : `<a class="dr-item" href="#${it.path}"><svg viewBox="0 0 24 24" aria-hidden="true">${it.icon}</svg>${it.label}${it.badge ? `<i class="nb inl" style="margin-left:auto">${it.badge}</i>` : ""}</a>`).join("");
}

function initDrawer(getItems) {
  drawerGetItems = getItems;
  const $ = id => document.getElementById(id);
  const btn = $("menu-btn"), list = $("drawer-list");
  renderDrawer();
  if (drawerBound) return;
  drawerBound = true;

  const isOpen = () => document.body.classList.contains("menu-open");
  const open = () => { document.body.classList.add("menu-open"); btn.setAttribute("aria-expanded", "true"); $("drawer-close").focus(); };
  const close = () => {
    if (!isOpen()) return;
    document.body.classList.remove("menu-open"); btn.setAttribute("aria-expanded", "false"); btn.focus();
  };

  btn.onclick = () => { renderDrawer(); open(); };
  $("drawer-back").onclick = close;
  $("drawer-close").onclick = close;
  $("bell-btn").onclick = () => go("/notifications");
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  window.addEventListener("hashchange", close);
  list.addEventListener("click", e => {
    const act = e.target.closest("[data-action]");
    if (act) { close(); if (act.dataset.action === "signout") doSignOut(); return; }
    if (e.target.closest("a")) close();   // same page par tap karne par hashchange nahi aata
  });
}
